<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PDA - 入库贴标</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%}body{background:#edf1f9;color:#172333;font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}button,input{font:inherit}button{cursor:pointer}[hidden]{display:none!important}
.frame{position:relative;width:375px;max-width:100vw;height:812px;max-height:100dvh;margin:auto;overflow:hidden;background:#f0f1f6;box-shadow:0 0 22px #1c305514}.page{height:100%;overflow-y:auto;padding-bottom:68px}.topbar{height:51px;display:grid;grid-template-columns:50px 1fr 50px;align-items:center;background:#fff}.topbar h1{margin:0;text-align:center;font-size:18px}.back,.scan-off{width:46px;height:46px;display:flex;align-items:center;justify-content:center;border:0;background:none;color:#1d2d40}.back{text-decoration:none}.back svg,.scan-off svg{width:22px;height:22px}
.scanbar{height:58px;padding:8px 9px;background:#fff}.scanbox{height:41px;display:flex;align-items:center;gap:6px;padding:0 11px;border-radius:22px;background:#ededf0}.search-icon{width:18px;height:18px;flex:none;color:#738295}.task-badge{display:flex;align-items:center;gap:3px;flex:none;color:#3765ff;font-size:12px}.task-badge svg{width:18px;height:18px}.scanbox input{min-width:0;flex:1;border:0;outline:0;background:none;color:#172333;font-size:12px}.scanbox input::placeholder{color:#b7bec9}.mode-button{width:26px;height:26px;flex:none;border:0;background:none;color:#34445a;font-size:20px}
.empty{padding-top:38px;text-align:center;color:#999;font-size:15px}.empty svg{width:102px;height:102px;display:block;margin:0 auto 6px}.summary{min-height:45px;display:flex;align-items:center;padding:0 10px;background:#fff}.summary b{margin-left:5px;color:#3765ff;font-weight:400}.content{padding:8px}.notice{min-height:37px;display:flex;align-items:center;gap:8px;padding:6px 10px;margin-bottom:8px;border:1px solid #bad6ff;border-radius:3px;background:#d5e5ff;color:#3765ff}.notice strong{display:grid;place-items:center;width:17px;height:17px;flex:none;border-radius:50%;background:#3765ff;color:#fff;font-size:11px}.sku-card{padding:9px 8px 10px;border:2px solid transparent;border-radius:7px;background:#fff}.sku-card.selected{border-color:#3765ff}.product-head{display:flex;gap:10px;min-height:119px}.product-image{width:70px;height:78px;flex:none;background:#e7d4d0}.product-image svg{width:100%;height:100%}.product-info{min-width:0;line-height:1.7}.sku-title{display:block;max-width:100%;overflow:hidden;padding:0;border:0;background:none;color:#3765ff;text-align:left;text-overflow:ellipsis;white-space:nowrap;font-size:15px;font-weight:700}.tag{display:inline-block;margin:4px 5px 4px 0;padding:2px 6px;border:1px solid #d7dce5;border-radius:2px;font-size:10px}.warehouse-line{overflow-wrap:anywhere;font-size:11px}.data-row{min-height:38px;display:flex;align-items:center;gap:9px;border-top:1px solid #eceef2;font-size:11px}.data-row .row-label{width:75px;flex:none;color:#4b5969}.data-row .row-value{flex:1}.data-row .pending{padding:3px 5px;border-radius:3px;background:#f1f1f3;color:#697586;white-space:nowrap}.edit-button{width:27px;height:28px;border:0;background:none;color:#3765ff}.edit-button svg{width:15px;height:15px}.qty-editor{display:flex;align-items:center;gap:4px}.qty-editor input{width:48px;height:28px;padding:0 5px;border:1px solid #bdc5d3;border-radius:3px}.qty-editor button{border:0;background:none;color:#3765ff}.defect-link{display:block;width:100%;height:32px;border:0;border-top:1px solid #eceef2;background:#fff;color:#3765ff;text-align:center}.footer{position:absolute;left:0;right:0;bottom:0;height:65px;padding:8px 9px 14px;background:#fff}.footer button{width:100%;height:43px;border:1px solid #3765ff;border-radius:4px;background:#3765ff;color:#fff;font-size:14px}
.mask{position:absolute;inset:0;z-index:20;display:flex;align-items:flex-end;background:#0009}.sheet{width:100%;height:80%;display:flex;flex-direction:column;background:#fff}.sheet-head{height:50px;flex:none;display:grid;grid-template-columns:60px 1fr 60px;align-items:center;border-bottom:1px solid #e7e9ee;text-align:center}.sheet-head strong{font-size:16px}.sheet-head button{height:45px;border:0;background:none;color:#3765ff;font-size:12px}.sheet-head button:first-child{text-align:left;padding-left:12px}.sheet-head button:last-child{text-align:right;padding-right:12px}.sheet-body{min-height:0;flex:1;overflow:auto;padding:9px;background:#fff}.sku-row{width:100%;min-height:45px;border:0;border-bottom:1px solid #eee;background:#fff;text-align:left;color:#3765ff}.defect-entry{margin-bottom:8px;border:1px solid #d5d9e1;border-radius:5px}.entry-row{display:flex;align-items:center;gap:8px;min-height:39px;padding:0 9px;border-bottom:1px solid #eee}.entry-row label{width:62px;flex:none;color:#687689}.entry-row select,.entry-row input{min-width:0;flex:1;height:36px;border:0;outline:0;background:none}.remove-defect{width:30px;height:30px;flex:none;display:grid;place-items:center;padding:0;border:0;background:none;color:#34445a}.remove-defect svg{width:16px;height:16px}.photo-row{display:flex;align-items:center;gap:8px;padding:8px 9px}.photo-add{width:58px;height:58px;border:0;border-radius:4px;background:#f3f4f6;color:#999;font-size:30px}.photo-name{min-width:0;overflow:hidden;color:#8a93a0;text-overflow:ellipsis;white-space:nowrap}.add-entry{width:100%;height:39px;border:1px solid #d5d9e1;border-radius:5px;background:#fff;color:#3765ff}
.finish-sheet,.finish-sheet .sheet-body{background:#f0f1f6}.finish-panel{overflow:hidden;border-radius:6px;background:#fff}.finish-row{display:flex;align-items:center;gap:8px;min-height:40px;padding:0 10px}.finish-row label{width:72px;flex:none}.finish-row .required{color:#f15353}.finish-row .choice{display:flex;align-items:center;gap:5px}.finish-row .choice input{accent-color:#3765ff}.toast{position:absolute;top:115px;left:50%;z-index:40;max-width:calc(100% - 20px);padding:8px 12px;border-radius:5px;background:#242424;color:#fff;text-align:center;white-space:nowrap;transform:translateX(-50%)}
</style>
</head>
<body><div class="frame"><main class="page">
<header class="topbar"><a class="back" href="PDA登录页.html" aria-label="返回PDA首页"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m14 4-8 8 8 8M6 12h15"/></svg></a><h1>入库贴标</h1><span class="scan-off" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 9V4h5m6 0h5v5M4 15v5h5m6 0h5v-5M7 10h10M7 13h10M8 16h8M3 3l18 18"/></svg></span></header>
<form class="scanbar" id="scanForm" autocomplete="off"><div class="scanbox"><svg id="searchIcon" class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="10.5" cy="10.5" r="7.5"/><path d="m16 16 5 5"/></svg><span class="task-badge" id="taskBadge" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9h18l-2 11H5L3 9ZM8 9 10 4m6 5-2-5M9 12v5m6-5v5"/></svg><span id="taskCode"></span></span><input id="scanInput" aria-label="扫描任务码或SKU" enterkeyhint="done" placeholder="请输入/扫描任务码获取待贴标任务"><button class="mode-button" type="button" id="skuListButton" aria-label="查看贴标的SKU">☷</button></div></form>
<section class="empty" id="emptyState"><svg viewBox="0 0 90 90" aria-hidden="true"><path fill="#e2eafe" d="M14 39h62v37H14zM23 28h44v48H23zM31 18h28v58H31z"/><circle cx="49" cy="52" r="18" fill="#fff" stroke="#4078ff" stroke-width="5"/><path d="m63 65 12 10" stroke="#4078ff" stroke-width="5" stroke-linecap="round"/><path d="M10 54v9m71-17v12" stroke="#ffc26c" stroke-width="4" stroke-linecap="round"/></svg>暂无数据</section>
<section id="taskView" hidden><div class="summary">本次贴标的SKU种类/数量：<b id="summaryCount">1/1</b></div><div class="content"><div class="notice"><strong>i</strong><span id="needLabelCount">当前任务需贴标： 1</span></div><article class="sku-card" id="skuCard"><div class="product-head"><div class="product-image"><svg viewBox="0 0 70 78" aria-label="商品示意图"><rect width="70" height="78" fill="#547aa1"/><circle cx="55" cy="16" r="15" fill="#ffd6a0" opacity=".6"/><path d="M0 70q35-34 70-7v15H0" fill="#e88f72"/><circle cx="35" cy="44" r="21" fill="#f5b192"/><path d="M13 46q-5-25 22-27 26 4 22 27l-8-9-14 5-15-7Z" fill="#49393e"/><circle cx="27" cy="45" r="2" fill="#422c33"/><circle cx="43" cy="45" r="2" fill="#422c33"/><path d="M29 55q6 5 12 0" fill="none" stroke="#ae5965" stroke-width="2"/><path d="M5 74q25-18 60 0" fill="#f2b36d"/></svg></div><div class="product-info"><button class="sku-title" id="skuTitle" type="button">smileying06</button><div id="productName">smileying06</div><span class="tag">含中文</span><span class="tag">加工费：0</span><div class="warehouse-line">仓库/仓位：最优路径测试仓库1/C02-04-02</div></div></div><div class="data-row"><span class="row-label">本次贴标数</span><span class="row-value" id="labelQtyText">1</span><div class="qty-editor" id="qtyEditor" hidden><input id="labelQtyInput" type="number" min="0" max="1" inputmode="numeric" value="1" aria-label="本次贴标数"></div><button class="edit-button" id="editQty" type="button" aria-label="修改本次贴标数"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m4 16 12-12 4 4L8 20H4zM14 6l4 4"/></svg></button><span class="pending" id="pendingCount">待上架数：1</span></div><div class="data-row"><span class="row-label">仓库备注</span><span>-</span></div><button class="defect-link" id="defectButton" type="button">不良品登记</button></article></div></section>
</main><footer class="footer" id="footer" hidden><button type="button" id="finishButton">完成贴标</button></footer>
<div class="mask" id="skuOverlay" hidden><section class="sheet" role="dialog" aria-modal="true" aria-label="贴标的SKU"><header class="sheet-head"><span></span><strong>贴标的SKU</strong><button type="button" data-close="skuOverlay">确定</button></header><div class="sheet-body"><button class="sku-row" type="button" id="skuSelect">smileying06　待上架数：1</button></div></section></div>
<div class="mask" id="defectOverlay" hidden><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="defectTitle"><header class="sheet-head"><button type="button" data-close="defectOverlay">取消</button><strong id="defectTitle">不良品登记</strong><button type="button" id="saveDefects">确定</button></header><div class="sheet-body"><div id="defectEntries"></div><button class="add-entry" type="button" id="addDefect">添加下一个</button></div></section></div>
<div class="mask" id="finishOverlay" hidden><section class="sheet finish-sheet" role="dialog" aria-modal="true" aria-labelledby="finishTitle"><header class="sheet-head"><button type="button" data-close="finishOverlay">取消</button><strong id="finishTitle">完成贴标</strong><button type="button" id="confirmFinish">确定</button></header><div class="sheet-body"><div class="finish-panel"><div class="finish-row"><label class="required">*转加工</label><label class="choice"><input type="radio" name="transferProcess" value="yes">是</label><label class="choice"><input type="radio" name="transferProcess" value="no">否</label></div></div></div></section></div>
<div class="toast" id="toast" role="status" hidden></div></div>
<script>
(function(){'use strict';
var $=function(id){return document.getElementById(id)},sku='smileying06',toastTimer;
var state={task:'',selected:false,labelQty:1,defects:[]};
function toast(message){$('toast').textContent=message;$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(function(){$('toast').hidden=true},2100)}
function open(id){$(id).hidden=false}function close(id){$(id).hidden=true}
function taskTotal(){return 1}
function render(){var active=!!state.task,total=taskTotal();$('emptyState').hidden=active;$('taskView').hidden=!active;$('footer').hidden=!active;$('taskBadge').hidden=!active;$('searchIcon').hidden=active;$('taskCode').textContent=state.task;$('scanInput').placeholder=active?'请输入/扫描SKU':'请输入/扫描任务码获取待贴标任务';$('skuCard').classList.toggle('selected',state.selected);$('skuTitle').textContent=sku;$('productName').textContent=sku;$('skuSelect').textContent=sku+'　待上架数：'+total;$('summaryCount').textContent='1/'+total;$('needLabelCount').textContent='当前任务需贴标： '+total;$('pendingCount').textContent='待上架数：'+total;$('labelQtyInput').max=total;$('labelQtyText').textContent=state.labelQty;$('labelQtyInput').value=state.labelQty;$('defectButton').textContent=state.defects.length?'不良品登记（'+state.defects.map(function(d){return d.reason+'/'+d.qty}).join('、')+'）':'不良品登记'}
function loadTask(code){sku='smileying06';state.task=code;state.selected=false;state.labelQty=1;state.defects=[];document.querySelectorAll('input[name=transferProcess]').forEach(function(radio){radio.checked=false});$('scanInput').value='';render();$('scanInput').focus()}
$('scanForm').addEventListener('submit',function(event){event.preventDefault();var code=$('scanInput').value.trim();if(!code)return;if(!state.task){loadTask(code);return}if(code.toLowerCase()===sku.toLowerCase()){state.selected=true;render();$('scanInput').focus();return}toast('未找到对应SKU')});
$('skuTitle').addEventListener('click',function(){$('scanInput').value=sku;$('scanInput').focus()});$('skuSelect').addEventListener('click',function(){close('skuOverlay');$('scanInput').value=sku;$('scanInput').focus()});$('skuListButton').addEventListener('click',function(){if(!state.task){toast('请先扫描任务码');return}open('skuOverlay')});$('taskBadge').addEventListener('click',function(){toast('当前任务：'+state.task)});
function validQty(){var raw=$('labelQtyInput').value.trim(),value=Number(raw);return raw!==''&&Number.isInteger(value)&&value>=0&&value<=taskTotal()?value:null}
function finishQtyEdit(){var value=validQty();if(value===null){toast('贴标数须为0至'+taskTotal());$('labelQtyInput').value=state.labelQty}else{state.labelQty=value}$('labelQtyText').textContent=state.labelQty;$('qtyEditor').hidden=true;$('labelQtyText').hidden=false;$('editQty').hidden=false}
$('editQty').addEventListener('click',function(){$('qtyEditor').hidden=false;$('labelQtyText').hidden=true;this.hidden=true;$('labelQtyInput').value=state.labelQty;$('labelQtyInput').focus();$('labelQtyInput').select()});$('labelQtyInput').addEventListener('input',function(){var value=validQty();if(value!==null){state.labelQty=value;$('labelQtyText').textContent=value}});$('labelQtyInput').addEventListener('blur',finishQtyEdit);$('labelQtyInput').addEventListener('keydown',function(event){if(event.key==='Enter'){event.preventDefault();this.blur()}});
function addDefect(data){var entry=document.createElement('div');entry.className='defect-entry';entry.innerHTML='<div class="entry-row"><label>不良原因</label><select aria-label="不良原因"><option value="">请选择</option><option value="破损">破损</option><option value="多发">多发</option><option value="其他">其他</option></select><button class="remove-defect" type="button" aria-label="删除不良品"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M5 5l14 14M19 5 5 19"/></svg></button></div><div class="entry-row"><label>不良数量</label><input type="number" min="1" max="1" inputmode="numeric" placeholder="请输入不良数量"></div><div class="photo-row"><button class="photo-add" type="button" aria-label="添加不良品图片">＋</button><input type="file" accept="image/*" hidden><span class="photo-name"></span></div>';
entry.querySelector('select').value=data?data.reason:'';entry.querySelector('input[type=number]').value=data?data.qty:'';entry.querySelector('.remove-defect').addEventListener('click',function(){entry.remove()});entry.querySelector('.photo-add').addEventListener('click',function(){entry.querySelector('input[type=file]').click()});entry.querySelector('input[type=file]').addEventListener('change',function(){entry.querySelector('.photo-name').textContent=this.files[0]?this.files[0].name:''});$('defectEntries').append(entry)}
$('defectButton').addEventListener('click',function(){$('defectEntries').replaceChildren();(state.defects.length?state.defects:[null]).forEach(addDefect);open('defectOverlay')});$('addDefect').addEventListener('click',function(){addDefect(null)});$('saveDefects').addEventListener('click',function(){var records=[],total=0;for(var entry of $('defectEntries').children){var reason=entry.querySelector('select').value,qty=Number(entry.querySelector('input[type=number]').value);if(!reason||!Number.isInteger(qty)||qty<1){toast('请填写不良原因和数量');return}total+=qty;records.push({reason:reason,qty:qty})}if(total>taskTotal()){toast('不良数量不能超过待上架数');return}state.defects=records;close('defectOverlay');render();toast('不良品登记已保存')});
$('finishButton').addEventListener('click',function(){var allBad=state.defects.reduce(function(sum,item){return sum+item.qty},0)>=taskTotal();if(allBad){finishLabel(true);return}open('finishOverlay')});
function finishLabel(allBad){var choice=document.querySelector('input[name=transferProcess]:checked');if(!allBad&&!choice){toast('请选择是否转加工');return}var code=state.task;state={task:'',selected:false,labelQty:1,defects:[]};$('scanInput').value='';close('finishOverlay');render();toast(code+(allBad?' 全部不良，任务结束':choice.value==='yes'?' 贴标完成，转加工':' 贴标完成，可上架'))}
$('confirmFinish').addEventListener('click',function(){finishLabel(false)});
document.querySelectorAll('[data-close]').forEach(function(button){button.addEventListener('click',function(){close(this.dataset.close)})});document.querySelectorAll('.mask').forEach(function(mask){mask.addEventListener('click',function(event){if(event.target===mask)close(mask.id)})});document.addEventListener('keydown',function(event){if(event.key==='Escape')document.querySelectorAll('.mask').forEach(function(mask){mask.hidden=true})});render();
})();
</script></body></html>
