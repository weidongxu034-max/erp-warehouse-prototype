let activePanel = null, activeCal = null;
function closePanels(){ if(activePanel){ activePanel.remove(); activePanel=null; } if(activeCal){ activeCal.remove(); activeCal=null; } }
document.addEventListener('mousedown', e=>{

});

function createSelect(cfg){
  // cfg: el, options[{label,value}], multiple, searchable, placeholder, onChange, width
  const el = cfg.el;
  let value = cfg.multiple ? [] : '';
  let panel = null;

  function render(){
    if(cfg.multiple){
      const vs = value;
      let inner = '';
      if(!vs.length) inner = '<span class="ph">'+(cfg.placeholder||'请选择')+'</span>';
      else {
        const show = vs.slice(0,2);
        inner = show.map(v=>'<span class="tag" data-v="'+esc(v)+'">'+esc(v)+'<i data-del="'+esc(v)+'">✕</i></span>').join('')
              + (vs.length>2 ? '<span class="tag more">+'+(vs.length-2)+'</span>' : '');
      }
      el.innerHTML = inner + '<span class="caret"><svg width="9" height="9" viewBox="0 0 10 10"><path d="M1.5 3.5 5 7l3.5-3.5" stroke="currentColor" stroke-width="1.2" fill="none" stroke-linecap="round"/></svg></span>';
      el.querySelectorAll('.tag i').forEach(i=> i.addEventListener('click', e=>{ e.stopPropagation(); remove(i.dataset.del); }));
    } else {
      el.innerHTML = (value ? '<span class="val">'+esc(value)+'</span>' : '<span class="ph">'+(cfg.placeholder||'请选择')+'</span>')
        + '<span class="clear '+(value?'has-v':'')+'" data-clear>✕</span>'
        + '<span class="caret"><svg width="9" height="9" viewBox="0 0 10 10"><path d="M1.5 3.5 5 7l3.5-3.5" stroke="currentColor" stroke-width="1.2" fill="none" stroke-linecap="round"/></svg></span>';
      const c = el.querySelector('[data-clear]');
      if(c) c.addEventListener('mousedown', e=>{ e.stopPropagation(); setValue('', true); });
    }
  }
  function remove(v){
    value = value.filter(x=>x!==v);
    render(); renderList(panel && panel.querySelector('input') ? panel.querySelector('input').value : '');
    cfg.onChange && cfg.onChange(value);
  }
  function filteredList(kw){
    return kw ? cfg.options.filter(o=>o.label.toLowerCase().includes(kw.toLowerCase())) : cfg.options;
  }
  function renderList(kw){
    if(!panel) return;
    const list = panel.querySelector('.dp-list');
    const opts = filteredList(kw);
    list.innerHTML = opts.length ? opts.map(o=>{
      const sel = cfg.multiple ? value.includes(o.value) : value===o.value;
      return '<div class="dp-opt'+(sel?' sel':'')+'" data-v="'+esc(o.value)+'">'
        + (cfg.multiple ? '<span class="ck">'+(sel?'✓':'')+'</span>' : '') + esc(o.label) + '</div>';
    }).join('') : '<div class="dp-empty">无匹配数据</div>';
    list.querySelectorAll('.dp-opt').forEach(opt=>{
      opt.addEventListener('click', ()=>{
        const v = opt.dataset.v;
        if(cfg.multiple){
          if(value.includes(v)) value = value.filter(x=>x!==v); else value.push(v);
          render(); renderList(kw); cfg.onChange && cfg.onChange(value);
        } else {
          setValue(v, true); closePanels();
        }
      });
    });
  }
  function open(){
    if(activePanel === panel && panel){ closePanels(); return; }
    closePanels();
    panel = document.createElement('div');
    panel.className = 'dropdown-panel';
    const minW = Math.max(el.offsetWidth, 120);
    panel.style.minWidth = minW+'px';
    panel.innerHTML = '<div class="dp-list"></div>';
    document.body.appendChild(panel);
    activePanel = panel;
    const r = el.getBoundingClientRect();
    const h = panel.offsetHeight || 200;
    let top = r.bottom + 4;
    if(top + Math.min(h, 300) > window.innerHeight - 8) top = Math.max(8, r.top - h - 8);
    panel.style.left = Math.min(r.left, window.innerWidth - minW - 8) + 'px';
    panel.style.top = top + 'px';
    renderList('');
    const si = panel.querySelector('.dp-search input');
    if(si){
      si.addEventListener('input', ()=>renderList(si.value));
      si.addEventListener('mousedown', e=>e.stopPropagation());
      setTimeout(()=>si.focus(), 30);
    }
  }
  function setValue(v, fire){
    value = v; render();
    if(fire) cfg.onChange && cfg.onChange(value);
  }
  el.addEventListener('click', e=>{ if(e.target.closest('[data-clear]')) return; open(); });
  render();
  el.setValue = setValue;     // API 同时挂载到元素，便于 $('#id').setValue() 调用
  el.getValue = ()=>value;
  return { setValue, getValue: ()=>value };
}

/* ---------- 日历组件 ---------- */
let calY, calM; // 年、月(0-based)
function openCalendar(triggerCtl, curVal, onPick, onClear){
  closePanels();
  const base = curVal ? new Date(curVal.slice(0,10)+'T00:00:00') : new Date();
  calY = base.getFullYear(); calM = base.getMonth();
  const p = document.createElement('div');
  p.className = 'calendar-panel';
  document.body.appendChild(p);
  activeCal = p;
  const selDay = curVal ? curVal.slice(0,10) : '';
  function render(){
    const first = new Date(calY, calM, 1);
    const startWk = first.getDay();
    const days = new Date(calY, calM+1, 0).getDate();
    const prevDays = new Date(calY, calM, 0).getDate();
    const today = fmtDT(new Date()).slice(0,10);
    let cells = '';
    for(let i=0;i<42;i++){
      const dnum = i - startWk + 1;
      let y=calY, m=calM, d=dnum, muted=false;
      if(d<1){ d = prevDays+d; m=calM-1; muted=true; }
      else if(d>days){ d = d-days; m=calM+1; muted=true; }
      if(m<0){ m=11; y--; } if(m>11){ m=0; y++; }
      const ds = y+'-'+pad(m+1)+'-'+pad(d);
      cells += '<div class="cal-cell'+(muted?' muted':'')+(ds===today?' today':'')+(ds===selDay?' sel':'')+'" data-d="'+ds+'">'+d+'</div>';
    }
    p.innerHTML = '<div class="cal-head">'
      + '<span class="cal-nav" data-nav="-1"><svg width="10" height="10" viewBox="0 0 10 10"><path d="M6.5 1.5 3 5l3.5 3.5" stroke="currentColor" stroke-width="1.3" fill="none" stroke-linecap="round"/></svg></span>'
      + '<span class="cal-title">'+calY+'年'+(calM+1)+'月</span>'
      + '<span class="cal-nav" data-nav="1"><svg width="10" height="10" viewBox="0 0 10 10"><path d="M3.5 1.5 7 5 3.5 8.5" stroke="currentColor" stroke-width="1.3" fill="none" stroke-linecap="round"/></svg></span></div>'
      + '<div class="cal-grid">' + ['日','一','二','三','四','五','六'].map(w=>'<div class="cal-wk">'+w+'</div>').join('') + cells + '</div>'
      + '<div class="cal-foot"><a data-act="clear">清空</a><a data-act="now">今天</a></div>';
    p.querySelectorAll('[data-nav]').forEach(n=>n.addEventListener('click', ()=>{ calM += +n.dataset.nav; if(calM<0){calM=11;calY--;} if(calM>11){calM=0;calY++;} render(); }));
    p.querySelectorAll('.cal-cell').forEach(c=>c.addEventListener('click', ()=>{ if(c.classList.contains('muted')) return; onPick(c.dataset.d); closePanels(); }));
    p.querySelector('[data-act="clear"]').addEventListener('click', ()=>{ onClear && onClear(); closePanels(); });
    p.querySelector('[data-act="now"]').addEventListener('click', ()=>{ onPick(fmtDT(new Date()).slice(0,10)); closePanels(); });
    const r = triggerCtl.getBoundingClientRect();
    let top = r.bottom + 4;
    if(top + 300 > window.innerHeight - 8) top = Math.max(8, r.top - 292);
    let left = Math.min(r.left, window.innerWidth - 244);
    p.style.left = left + 'px'; p.style.top = top + 'px';
  }
  render();
}

/* ---------- 查询控件初始化 ---------- */
const scanWhSel = createSelect({ el:$('#scanWhSel'), options:WHS.map(v=>({label:v,value:v})), searchable:true, placeholder:'选择仓库',
  onChange:v=>{ store.scanWh=v; } });
scanWhSel.setValue('618清仓大甩卖', true);
createSelect({ el:$('#fOpSel'), options:OPS.map(v=>({label:v,value:v})), placeholder:'请选择',
  onChange:v=>{ store.q.op=v; } });
createSelect({ el:$('#fStSel'), options:STATUS.map(v=>({label:v,value:v})), placeholder:'请选择',
  onChange:v=>{ store.q.st=v; } });
createSelect({ el:$('#fWhSel'), options:WHS.map(v=>({label:v,value:v})), placeholder:'请选择',
  onChange:v=>{ store.q.wh=v; } });
createSelect({ el:$('#fDocSel'), options:DOCS.map(v=>({label:v,value:v})), placeholder:'请选择',
  onChange:v=>{ store.q.doc=v; } });
createSelect({ el:$('#pgSizeSel'), options:[{label:'20条/页',value:20},{label:'50条/页',value:50},{label:'100条/页',value:100}], placeholder:'',
  onChange:v=>{ store.size=+v; store.page=1; renderTable(); } });
$('#pgSizeSel').setValue(100);

// 签收时间（范围）
function bindCal(elId, key, ph){
  const el = $(elId);
  el.classList.add('cal-ctl');
  el.addEventListener('click', ()=>{
    openCalendar(el, store.q[key],
      d=>{ store.q[key] = d + (key==='t1' ? ' 00:00:00' : ' 23:59:59');
           el.innerHTML = '<span class="val">'+store.q[key]+'</span>'; },
      ()=>{ store.q[key]=''; el.innerHTML = '<span class="ph">'+ph+'</span>'; });
  });
}
bindCal('#fT1','t1','开始时间');
bindCal('#fT2','t2','结束时间');

$('#fNo').addEventListener('keydown', e=>{ if(e.key==='Enter') doQuery(); });
$('#fRef').addEventListener('keydown', e=>{ if(e.key==='Enter') doQuery(); });
$('#scanInput').addEventListener('keydown', e=>{ if(e.key==='Enter') doSign(); });
$('#btnQuery').addEventListener('click', doQuery);
$('#btnReset').addEventListener('click', doReset);
$('#btnExport').addEventListener('click', doExport);

/* ---------- 查询 / 重置 ---------- */
function doQuery(){
  store.q.no  = $('#fNo').value.trim();
  store.q.ref = $('#fRef').value.trim();
  store.page = 1;
  renderTable();
}
function doReset(){
  $('#fNo').value=''; $('#fRef').value='';
  store.q = { no:'', ref:'', op:'', st:'', wh:'', doc:'', t1:'', t2:'' };
  store.scanWh = '';
  scanWhSel.setValue('');
  $('#fOpSel').setValue(''); $('#fStSel').setValue(''); $('#fWhSel').setValue(''); $('#fDocSel').setValue('');
  $('#fT1').innerHTML = '<span class="ph">开始日期</span><span class="ph">开始时间</span>';
  $('#fT2').innerHTML = '<span class="ph">结束日期</span><span class="ph">结束时间</span>';
  store.page = 1;
  renderTable();
  toast('success','重置成功');
}

/* ---------- 过滤 ---------- */
function getFiltered(){
  const q = store.q;
  return store.data.filter(d=>{
    if(q.no  && !d.no.toLowerCase().includes(q.no.toLowerCase())) return false;
    if(q.ref && !(d.ref||'').toLowerCase().includes(q.ref.toLowerCase())) return false;
    if(q.op  && d.op !== q.op) return false;
    if(q.st  && d.st !== q.st) return false;
    if(q.wh  && d.wh !== q.wh) return false;
    if(q.doc && d.doc !== q.doc) return false;
    if(q.t1 && (!d.t1 || d.t1 < q.t1)) return false;
    if(q.t2 && (!d.t1 || d.t1 > q.t2)) return false;
    return true;
  });
}

/* ---------- 表格渲染 ---------- */
function copyText(t){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(()=>toast('success','复制成功：'+t)).catch(()=>fallbackCopy(t));
  } else fallbackCopy(t);
}
function fallbackCopy(t){
  const ta = document.createElement('textarea');
  ta.value = t; document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); toast('success','复制成功：'+t); }catch(e){ toast('error','复制失败'); }
  ta.remove();
}
const COPY_SVG = '<svg width="12" height="12" viewBox="0 0 14 14" fill="none"><rect x="4.5" y="4.5" width="8" height="8" rx="1.2" stroke="currentColor" stroke-width="1.2"/><path d="M9.5 2.5h-7a1 1 0 0 0-1 1v7" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>';

function renderTable(){
  const rows = getFiltered();
  const total = rows.length;
  const tp = Math.max(1, Math.ceil(total/store.size));
  if(store.page > tp) store.page = tp;
  const start = (store.page-1)*store.size;
  const pageRows = rows.slice(start, start+store.size);
  $('#pgTotal').textContent = '共 ' + total.toLocaleString() + ' 条';

  const tbody = $('#tbody');
  if(!pageRows.length){
    tbody.innerHTML = '<tr><td colspan="9" style="padding:0;cursor:default;"><div class="empty">'
      + '<svg width="52" height="40" viewBox="0 0 64 48" fill="none"><rect x="14" y="10" width="36" height="28" rx="2" stroke="#d9d9d9" stroke-width="2"/><path d="M24 22h16M24 28h10" stroke="#d9d9d9" stroke-width="2" stroke-linecap="round"/><ellipse cx="32" cy="42" rx="18" ry="3" fill="#f0f0f0"/></svg>'
      + '<div class="e-txt">暂无数据</div></div></td></tr>';
  } else {
    tbody.innerHTML = pageRows.map((d,i)=>{
      const seq = start + i + 1;
      const selCls = (d.id===store.selectedId ? ' selected':'') + (d.id===store.flashId ? ' flash':'');
      return '<tr data-id="'+d.id+'" class="'+selCls.trim()+'">'
        + '<td class="c">'+seq+'</td>'
        + '<td><span class="cell-copy"><span class="txt">'+esc(d.no)+'</span><span class="copy-btn" data-copy="'+esc(d.no)+'" title="复制">'+COPY_SVG+'</span></span></td>'
        + '<td>'+esc(d.doc)+'</td>'
        + '<td><span class="cell-copy"><span class="txt">'+esc(d.ref)+'</span>'+(d.ref?'<span class="copy-btn" data-copy="'+esc(d.ref)+'" title="复制">'+COPY_SVG+'</span>':'')+'</span></td>'
        + '<td>'+esc(d.wh)+'</td>'
        + '<td>'+esc(d.op)+'</td>'
        + '<td class="'+(d.st==='异常签收'?'st-abnormal':'st-normal')+'">'+esc(d.st)+'</td>'
        + '<td>'+esc(d.t1)+'</td>'
        + '<td>'+esc(d.t2)+'</td>'
        + '</tr>';
    }).join('');
  }
  store.flashId = null;
  renderPagination(tp);
}

/* ---------- 分页 ---------- */
function renderPagination(tp){
  const cur = store.page;
  const list = [];
  const push = v=>list.push(v);
  if(tp <= 7){ for(let i=1;i<=tp;i++) push(i); }
  else {
    push(1);
    if(cur > 3) push('...');
    for(let i=Math.max(2,cur-1); i<=Math.min(tp-1,cur+1); i++) push(i);
    if(cur < tp-2) push('...');
    push(tp);
  }
  let html = '<span class="pg-item arrow'+(cur===1?' disabled':'')+'" data-pg="'+(cur-1)+'"><i>‹</i></span>';
  html += list.map(p=> p==='...'
    ? '<span class="pg-item dot">···</span>'
    : '<span class="pg-item'+(p===cur?' active':'')+'" data-pg="'+p+'">'+p+'</span>').join('');
  html += '<span class="pg-item arrow'+(cur===tp?' disabled':'')+'" data-pg="'+(cur+1)+'"><i>›</i></span>';
  $('#pgList').innerHTML = html;
  $('#pgList').querySelectorAll('.pg-item[data-pg]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const p = +el.dataset.pg;
      if(p<1 || p>tp || p===store.page) return;
      store.page = p; renderTable();
    });
  });
}
$('#pgJump').addEventListener('keydown', e=>{
  if(e.key!=='Enter') return;
  const rows = getFiltered();
  const tp = Math.max(1, Math.ceil(rows.length/store.size));
  let p = parseInt(e.target.value, 10);
  if(isNaN(p)) return;
  p = Math.min(Math.max(1,p), tp);
  store.page = p; e.target.value=''; renderTable();
  toast('info','已跳转至第 '+p+' 页');
});

// 行内复制
$('#tbody').addEventListener('click', e=>{
  const cb = e.target.closest('.copy-btn');
  if(cb){ e.stopPropagation(); copyText(cb.dataset.copy); return; }
});

/* ---------- 扫描签收 ---------- */
function genRef(){
  let s = '3';
  for(let i=0;i<9;i++) s += Math.floor(Math.random()*10);
  return s;
}
function doSign(){
  const wh = store.scanWh;
  const ipt = $('#scanInput');
  const no = ipt.value.trim();
  if(!wh){ toast('warning','请先在「扫描/输入」左侧选择仓库'); return; }
  if(!no){ toast('warning','请扫描或输入物流单号'); return; }
  if(store.data.some(d=>d.no===no)){ toast('error','物流单号 '+no+' 已签收，请勿重复签收'); return; }
  const now = fmtDT(new Date());
  const rec = { id: ++store.idSeq, no: no, doc: '采购单', ref: genRef(), wh: wh, op: 'XWD', st: '正常签收', t1: now, t2: now };
  store.data.unshift(rec);
  // 重置查询条件回到全量第一页，保证新签收数据可见
  $('#fNo').value=''; $('#fRef').value='';
  store.q = { no:'', ref:'', op:'', st:'', wh:'', doc:'', t1:'', t2:'' };
  $('#fOpSel').setValue(''); $('#fStSel').setValue(''); $('#fWhSel').setValue('');   $('#fDocSel').setValue('');
  $('#fT1').innerHTML = '<span class="ph">开始时间</span>';
  $('#fT2').innerHTML = '<span class="ph">结束时间</span>';
  store.page = 1;
  store.selectedId = rec.id;
  store.flashId = rec.id;
  ipt.value='';
  renderTable();
  toast('success','签收成功：'+no+'（'+wh+'）');
}

/* ---------- 导出 ---------- */
function doExport(){
  const rows = getFiltered();
  if(!rows.length){ toast('warning','当前查询结果为空，无可导出数据'); return; }
  const head = ['物流单号','签收单据','关联单号','仓库','签收员','签收状态','签收时间','关联时间'];
  const escCsv = v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const csv = '\uFEFF' + head.map(escCsv).join(',') + '\n'
    + rows.map(d=>[d.no,d.doc,d.ref,d.wh,d.op,d.st,d.t1,d.t2].map(escCsv).join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  const t = fmtDT(new Date()).replace(/[-: ]/g,'');
  a.download = '快递签收_' + t + '.csv';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 800);
  toast('success','导出成功，共导出 '+rows.length+' 条数据');
}

/* ---------- 初始渲染 ---------- */
renderTable();
</script>
