  <div class="field range-field"><label>区间</label><div class="control combo range-control"><select id="rangeMode"><option>SKU种类</option><option>商品数量</option><option>预估重量</option></select><input id="rangeMin" type="number" min="0" placeholder="最小值"><span>~</span><input id="rangeMax" type="number" min="0" placeholder="最大值"></div></div>
  <div class="field"><label>加急分类</label><div class="floating-select" id="urgentSelect"></div></div>
  <div class="field pickup-status-field"><label>揽收状态</label><div id="pickupStatusTiles"></div></div>
  <div class="field"><label>订制品</label><div id="customTiles"></div></div>
  <div class="field"><label>扣减库存</label><div id="deductTiles"></div></div>
  <div class="outbound-actions"><button class="link-btn" type="button" id="toggleFilters">收起⌃</button><button class="btn" type="button" id="resetQuery">重置</button><button class="btn primary" type="submit">查询</button></div>
  <div class="quick-search"><button type="button" class="btn" id="addQuickSearch">＋ 添加快捷搜索</button><div id="quickSearchList"></div></div>
</div></form></section>
<section class="card table-card-inbound outbound-table-card"><div class="toolbar"><div class="export-wrap" id="exportWrap"><button class="btn" type="button" id="exportToggle">导出相关 ⌄</button><div class="export-menu"><button type="button" id="exportBtn">历史订单出库日志导出</button><button type="button" id="historyBtn">历史导出任务</button></div></div></div>

</main></div>
