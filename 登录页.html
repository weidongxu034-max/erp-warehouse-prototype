<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ERP - 登录</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;color:#111}button,input{font:inherit}button{cursor:pointer}.login-shell{min-height:100vh;display:grid;grid-template-columns:62.5% 37.5%}.brand-panel{position:relative;display:flex;align-items:center;overflow:hidden;padding:9.5%;background:linear-gradient(115deg,#2961ed,#3d68ff 64%,#2e59e8);color:#fff}.brand-panel:before{content:"";position:absolute;width:810px;height:560px;top:-90px;right:-130px;border:28px solid #fff2;border-radius:28px;transform:rotate(12deg);box-shadow:0 0 0 70px #fff1,0 0 0 140px #fff1}.brand-panel:after{content:"";position:absolute;width:890px;height:350px;left:5%;bottom:-145px;border:18px solid #fff1;border-radius:45px;transform:rotate(-12deg);background:repeating-linear-gradient(0deg,transparent 0 27px,#fff1 28px 31px)}.brand-content{position:relative;z-index:1}.brand-name{display:flex;align-items:center;gap:16px;font-size:40px;font-weight:300}.brand-name svg{width:60px;height:60px}.brand-content h1{margin:48px 0 12px;font-size:64px;font-weight:700;letter-spacing:2px}.brand-content p{font-size:24px;font-weight:300;white-space:nowrap}.login-panel{display:flex;align-items:center;justify-content:center;padding:40px;background:#fff}.login-card{width:min(480px,100%)}.tabs{height:48px;display:flex;gap:32px;align-items:stretch;border-bottom:1px solid #e7e7e7}.tabs button{padding:0;border:0;border-bottom:2px solid transparent;background:#fff;font-size:16px;white-space:nowrap}.tabs button.active{border-bottom-color:#3d68ff;color:#3d68ff}.login-fields{padding-top:16px}.login-input{position:relative;margin-bottom:24px}.login-input input{width:100%;height:56px;padding:0 40px 0 12px;border:1px solid #d9d9d9;border-radius:8px;outline:0}.login-input input:focus{border-color:#3d68ff}.login-input input::placeholder{color:#c5c8cc}.input-action{position:absolute;right:10px;top:14px;width:28px;height:28px;border:0;background:none;color:#999;font-size:17px}.submit{width:100%;height:56px;border:0;border-radius:7px;background:#4169fa;color:#fff;font-size:20px}.submit:hover{background:#3159ea}.passkey-view{padding-top:52px;text-align:center}.passkey-view svg{display:block;width:78px;height:78px;margin:0 auto 76px;color:#3d68ff}.login-error{min-height:22px;color:#e34b45;font-size:13px}.login-tip{position:fixed;top:22px;left:50%;z-index:3;padding:9px 16px;border-radius:4px;background:#303133;color:#fff;transform:translateX(-50%)}.login-tip[hidden]{display:none}@media(max-width:800px){.login-shell{display:block}.brand-panel{min-height:240px;padding:35px}.brand-content h1{margin:20px 0 6px;font-size:34px}.brand-content p{font-size:15px;white-space:normal}.brand-name{font-size:25px}.brand-name svg{width:37px;height:37px}.login-panel{min-height:calc(100vh - 240px);padding:30px 20px}}
</style>
</head>
<body>
<main class="login-shell"><section class="brand-panel"><div class="brand-content"><div class="brand-name"><svg viewBox="0 0 60 60" fill="none" stroke="currentColor" stroke-width="5" aria-hidden="true"><path d="m30 4 23 13v27L30 57 7 44V17zM7 17l23 13 23-13M30 30v27"/></svg>ERP</div><h1>企业级电商ERP</h1><p>简单、易用、高效，为您的电商运营注入新的活力</p></div></section><section class="login-panel"><div class="login-card"><div class="tabs" role="tablist" aria-label="登录方式"><button class="active" type="button" role="tab" aria-selected="true" data-mode="phone">手机号登录</button><button type="button" role="tab" aria-selected="false" data-mode="email">邮箱登录</button><button type="button" role="tab" aria-selected="false" data-mode="passkey">通行密钥登录 ⓘ</button></div><form id="loginForm" class="login-fields"><div class="login-input"><input id="account" autocomplete="username" inputmode="tel" placeholder="请输入手机号" aria-label="手机号"><button class="input-action" id="clearAccount" type="button" aria-label="清空账号">×</button></div><div class="login-input"><input id="password" type="password" autocomplete="current-password" placeholder="请输入密码" aria-label="密码"><button class="input-action" id="togglePassword" type="button" aria-label="显示密码">◉</button></div><div class="login-error" id="loginError" role="alert"></div><button class="submit" type="submit">进入系统</button></form><div class="passkey-view" id="passkeyView" hidden><svg viewBox="0 0 80 80" fill="none" stroke="currentColor" stroke-width="4" aria-hidden="true"><path d="M15 57h42v9H15zM20 26h26v31H20zM24 32h18M24 40h18M24 48h12M47 32v-8a12 12 0 0 1 24 0v8M47 32h24v22H47z"/><circle cx="59" cy="42" r="2"/></svg><button class="submit" id="passkeyLogin" type="button">使用通行密钥登录</button></div></div></section></main>
<div class="login-tip" id="loginTip" role="status" hidden></div>
<script>
(function(){
  'use strict';
  var $=function(id){return document.getElementById(id)},mode='phone',timer;
  function tip(text){$('loginTip').textContent=text;$('loginTip').hidden=false;clearTimeout(timer);timer=setTimeout(function(){$('loginTip').hidden=true},2600)}
  document.querySelectorAll('[data-mode]').forEach(function(tab){tab.addEventListener('click',function(){mode=tab.dataset.mode;document.querySelectorAll('[data-mode]').forEach(function(button){var selected=button===tab;button.classList.toggle('active',selected);button.setAttribute('aria-selected',String(selected))});$('loginForm').hidden=mode==='passkey';$('passkeyView').hidden=mode!=='passkey';$('account').placeholder=mode==='email'?'请输入邮箱':'请输入手机号';$('account').setAttribute('aria-label',mode==='email'?'邮箱':'手机号');$('account').inputMode=mode==='email'?'email':'tel';$('loginError').textContent='';if(mode!=='passkey')$('account').focus()})});
  $('clearAccount').addEventListener('click',function(){$('account').value='';$('account').focus()});
  $('togglePassword').addEventListener('click',function(){var visible=$('password').type==='password';$('password').type=visible?'text':'password';this.setAttribute('aria-label',visible?'隐藏密码':'显示密码')});
  $('loginForm').addEventListener('submit',function(event){event.preventDefault();var account=$('account').value.trim(),password=$('password').value;if(mode==='phone'&&!/^1[3-9]\d{9}$/.test(account)){$('loginError').textContent='请输入正确的手机号';return}if(mode==='email'&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(account)){$('loginError').textContent='请输入正确的邮箱';return}if(!password){$('loginError').textContent='请输入密码';return}try{sessionStorage.setItem('erp-demo-login',account)}catch(_){}var next=new URL('index.html',location.href);next.searchParams.set('_t',String(Date.now()));location.href=next.href});
  $('passkeyLogin').addEventListener('click',function(){tip('通行密钥登录需接入认证服务')});
})();
</script>
</body>
</html>
