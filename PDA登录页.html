<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f9ff">
<title>PDA - 登录</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%}body{background:#f7f9ff;color:#303133;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.screen{width:100%;max-width:430px;min-height:100vh;min-height:100dvh;margin:0 auto;padding:65px 20px 28px;background:linear-gradient(180deg,#fff 0,#f7f9ff 160px,#f7f9ff 100%)}.brand{height:88px;display:flex;align-items:center;justify-content:center}.brand svg{width:81px;height:88px}.login-form{margin-top:57px}.tabs{height:49px;display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid #e7e9ef}.tab{position:relative;padding:0 0 13px;border:0;background:none;color:#303133;font-family:inherit;font-size:18px;line-height:1.3;cursor:pointer}.tab.active{color:#3d68ff}.tab.active:after{position:absolute;bottom:-1px;left:50%;width:88px;height:2px;background:#3d68ff;content:"";transform:translateX(-50%)}.fields{margin-top:16px;padding:9px 10px;background:#fff}.field{position:relative;height:44px;display:flex;align-items:center}.field+.field{margin-top:4px;border-top:1px solid #e5e8ef;padding-top:4px;height:48px}.field input{width:100%;height:30px;padding:0 4px;border:0;border-radius:0;background:#eaf1ff;color:#18212d;font-family:inherit;font-size:16px;line-height:30px;outline:0}.field input::placeholder{color:#a4adbb}.field input:focus{box-shadow:inset 0 0 0 1px #a7bfff}.password-field input{padding-right:42px}.eye{position:absolute;right:2px;top:7px;width:34px;height:31px;display:flex;align-items:center;justify-content:center;border:0;background:#fff;color:#8c949f;cursor:pointer}.eye svg{width:18px;height:18px}.field+.field .eye{top:11px}.message{min-height:20px;margin-top:8px;color:#e35d5d;font-size:12px}.login-button{width:100%;height:47px;margin-top:13px;border:0;border-radius:4px;background:#3d68ff;color:#fff;font-family:inherit;font-size:20px;line-height:1.2;cursor:pointer}.login-button:active{background:#3158da}@media(max-width:360px){.screen:not(.home-mode){padding-right:16px;padding-left:16px}.tab{font-size:16px}}@media(min-width:431px){body{background:#eef2f9}.screen{box-shadow:0 0 22px #1c305514}}@media(prefers-reduced-motion:no-preference){.login-button,.tab{transition:color .15s,background .15s}}
.screen.home-mode{padding:0 10px 26px;background:#f7f8ff}.home-view[hidden],.login-view[hidden],.account-menu[hidden]{display:none!important}.home-head{position:relative;height:40px;display:flex;align-items:center;justify-content:space-between;background:#fff;color:#182333;font-size:13px;font-weight:600}.home-head-actions{display:flex;align-items:center;gap:10px}.web-link{color:#3d68ff;font-size:12px;line-height:18px;text-decoration:none}.avatar-button{width:25px;height:25px;display:flex;align-items:center;justify-content:center;border:0;border-radius:50%;background:#f0f1f3;color:#c0c4c9;cursor:pointer}.avatar-button svg{width:16px;height:16px}.account-menu{position:absolute;top:34px;right:0;z-index:5;width:176px;padding:10px;border:1px solid #e4e7ed;border-radius:5px;background:#fff;box-shadow:0 6px 18px #0002;font-size:12px;font-weight:400;word-break:break-all}.account-menu button{display:block;width:100%;margin-top:10px;padding:6px;border:1px solid #d5d8df;border-radius:4px;background:#fff;color:#315efb;font:inherit;cursor:pointer}.feature-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.feature{height:50px;display:flex;align-items:flex-start;justify-content:space-between;padding:7px 8px;border-radius:4px;color:#fff}.feature.blue{background:#3d68ff}.feature.green{background:#14bf91}.feature strong{display:block;font-size:14px;line-height:19px}.feature small{display:block;margin-top:2px;font-size:9px;line-height:13px}.feature svg{width:17px;height:17px;flex:none;margin-top:2px}.module-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:10px}.module{height:55px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:5px;background:#fff;color:#141b28;text-align:center;font-size:11px;font-weight:600;white-space:nowrap}.module svg{width:19px;height:19px;fill:none;stroke:#21364a;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.module svg .accent{stroke:#c17b31}.sprite{position:absolute;width:0;height:0;overflow:hidden}@media(max-width:360px){.module-grid,.feature-grid{gap:7px}.module{font-size:10px}}
</style>
</head>
<body>
<main class="screen" id="screen">
<section class="login-view" id="loginView">
  <div class="brand" aria-label="PDA">
    <svg viewBox="0 0 82 90" role="img" aria-label="PDA 标志" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M11 9H49C65 9 75 20 75 34C75 49 64 59 49 59H35" stroke="#3D68FF" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M11 81V43C11 33 17 27 27 27H51" stroke="#3D68FF" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M35 81H71" stroke="#3D68FF" stroke-width="13" stroke-linecap="round"/>
    </svg>
  </div>
  <form class="login-form" id="loginForm" novalidate>
    <div class="tabs" role="tablist" aria-label="登录方式">
      <button type="button" class="tab active" id="phoneTab" role="tab" aria-selected="true" aria-controls="loginFields">手机号登录</button>
      <button type="button" class="tab" id="emailTab" role="tab" aria-selected="false" aria-controls="loginFields">邮箱登录</button>
    </div>
    <div class="fields" id="loginFields">
      <div class="field"><input id="account" type="tel" inputmode="numeric" autocomplete="tel" aria-label="手机号" placeholder="请输入手机号"></div>
      <div class="field password-field"><input id="password" type="password" autocomplete="current-password" aria-label="密码" placeholder="请输入密码"><button type="button" class="eye" id="showPassword" aria-label="显示密码" aria-pressed="false"><svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M2 10s3-4 8-4 8 4 8 4-3 4-8 4-8-4-8-4Z" stroke="currentColor" stroke-width="1.3"/><circle cx="10" cy="10" r="2" stroke="currentColor" stroke-width="1.3"/><path id="eyeSlash" d="M3 17 17 3" stroke="currentColor" stroke-width="1.3"/></svg></button></div>
    </div>
    <div class="message" id="message" role="status" aria-live="polite"></div>
    <button type="submit" class="login-button">登录</button>
  </form>
</section>
<section class="home-view" id="homeView" hidden aria-label="PDA首页">
  <svg class="sprite" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <symbol id="ico-clipboard" viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="1"/><path d="M9 4.5V3h6v1.5M9 9h6M9 13h6M9 17h4"/><path class="accent" d="M15 17h1"/></symbol>
    <symbol id="ico-box" viewBox="0 0 24 24"><path d="M4 8h16v12H4zM4 8l3-4h10l3 4M12 8v12"/><path class="accent" d="M9 12h6"/></symbol>
    <symbol id="ico-up" viewBox="0 0 24 24"><path d="M4 20V9l8-6 8 6v11M8 20v-6h8v6M12 16V9m0 0-3 3m3-3 3 3"/><path class="accent" d="M4 20h16"/></symbol>
    <symbol id="ico-inspect" viewBox="0 0 24 24"><path d="m12 2 8 4v11l-8 5-8-5V6zM8 10h8M8 14h5"/><path class="accent" d="m15 14 1 1 2-2"/></symbol>
    <symbol id="ico-tag" viewBox="0 0 24 24"><path d="M5 3h12l2 3v15H5zM17 3v4h2M9 11h6M9 15h4"/><path class="accent" d="M8 7h5"/></symbol>
    <symbol id="ico-tools" viewBox="0 0 24 24"><path d="m5 18 11-11 2 2L7 20H5zM13 5l2-2 4 4-2 2M9 11l4 4"/><path class="accent" d="M5 20h14"/></symbol>
    <symbol id="ico-transfer" viewBox="0 0 24 24"><path d="M5 6h13l-3-3M18 6l-3 3M19 18H6l3-3M6 18l3 3M6 11h12v4H6z"/><path class="accent" d="M9 13h6"/></symbol>
    <symbol id="ico-basket" viewBox="0 0 24 24"><path d="M4 10h16l-2 10H6zM8 10l4-7 4 7M9 14v3M12 14v3M15 14v3"/><path class="accent" d="M4 10h16"/></symbol>
    <symbol id="ico-crown" viewBox="0 0 24 24"><path d="M3 18h18l-2-11-5 5-2-7-2 7-5-5zM4 21h16"/><path class="accent" d="M12 5v3"/></symbol>
    <symbol id="ico-return" viewBox="0 0 24 24"><path d="M5 5h14v16H5zM9 9h6M9 13h5M8 17h8M8 3h8"/><path class="accent" d="m15 15 2 2-2 2"/></symbol>
    <symbol id="ico-product" viewBox="0 0 24 24"><path d="M6 7h12l1 14H5zM9 9V6a3 3 0 0 1 6 0v3M9 13h6"/><path class="accent" d="M10 17h4"/></symbol>
  </svg>
  <header class="home-head"><span><span id="welcomeName">XWD</span>, 欢迎使用</span><div class="home-head-actions"><a class="web-link" href="快递签收.html" aria-label="返回 Web 快递签收页">web</a><button type="button" class="avatar-button" id="accountButton" aria-label="账号菜单" aria-expanded="false"><svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><circle cx="10" cy="6" r="3.5"/><path d="M3 17c0-3.5 3-5.5 7-5.5s7 2 7 5.5Z"/></svg></button></div><div class="account-menu" id="accountMenu" hidden><span id="accountText"></span><button type="button" id="logoutButton">退出登录</button></div></header>
  <div class="feature-grid"><a class="feature blue" href="../其他内容/PDA快递签收.html" style="text-decoration:none"><div><strong>快递签收</strong><small>扫描快递单号</small></div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h16M4 10h16M4 15h16M4 20h16"/></svg></a><a class="feature green" href="PDA入库签收.html" style="text-decoration:none"><div><strong>入库签收</strong><small>仓库入库签收</small></div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 4h12v16H6zM9 2h6v4H9M9 10h6M9 14h6"/></svg></a></div>
  <div class="module-grid" aria-label="PDA功能">
    <a class="module" href="../其他内容/PDA入库上架.html" style="text-decoration:none"><svg><use href="#ico-up"/></svg><span>入库上架</span></a>
    <a class="module" href="PDA入库质检.html" style="text-decoration:none"><svg><use href="#ico-inspect"/></svg><span>入库质检</span></a>
    <a class="module" href="PDA入库贴标.html" style="text-decoration:none"><svg><use href="#ico-tag"/></svg><span>入库贴标</span></a>
    <a class="module" href="../其他内容/PDA入库加工.html" style="text-decoration:none"><svg><use href="#ico-tools"/></svg><span>入库加工</span></a>
    <a class="module" href="../其他内容/PDA调拨入库.html" style="text-decoration:none"><svg><use href="#ico-transfer"/></svg><span>调拨入库</span></a>
    <a class="module" href="../其他内容/PDA发货任务登记.html" style="text-decoration:none"><svg><use href="#ico-tag"/></svg><span>发货任务登记</span></a>
    <a class="module" href="../其他内容/PDA单品配货.html" style="text-decoration:none"><svg><use href="#ico-basket"/></svg><span>单品配货</span></a>
    <a class="module" href="../其他内容/PDA多品配货.html" style="text-decoration:none"><svg><use href="#ico-basket"/></svg><span>多品配货</span></a>
    <a class="module" href="../其他内容/PDA爆款配货.html" style="text-decoration:none"><svg><use href="#ico-crown"/></svg><span>爆款配货</span></a>
    <a class="module" href="../其他内容/PDA调拨出库.html" style="text-decoration:none"><svg><use href="#ico-transfer"/></svg><span>调拨出库</span></a>
    <a class="module" href="../其他内容/PDA手动修改仓位.html" style="text-decoration:none"><svg><use href="#ico-tools"/></svg><span>手动修改仓位</span></a>
    <a class="module" href="../其他内容/PDA任务修改仓位.html" style="text-decoration:none"><svg><use href="#ico-clipboard"/></svg><span>任务修改仓位</span></a>
    <a class="module" href="../其他内容/PDA手动盘点.html" style="text-decoration:none"><svg><use href="#ico-clipboard"/></svg><span>手动盘点</span></a>
    <a class="module" href="../其他内容/PDA任务盘点.html" style="text-decoration:none"><svg><use href="#ico-clipboard"/></svg><span>任务盘点</span></a>
    <a class="module" href="../其他内容/PDA库内上架.html" style="text-decoration:none"><svg><use href="#ico-up"/></svg><span>库内上架</span></a>
    <a class="module" href="../其他内容/PDA退包分拣.html" style="text-decoration:none"><svg><use href="#ico-return"/></svg><span>退包分拣</span></a>
    <a class="module" href="../其他内容/PDA退包签收.html" style="text-decoration:none"><svg><use href="#ico-return"/></svg><span>退包签收</span></a>
    <a class="module" href="../其他内容/PDA退包上架.html" style="text-decoration:none"><svg><use href="#ico-return"/></svg><span>退包上架</span></a>
    <a class="module" href="../其他内容/PDA商品信息查询.html" style="text-decoration:none"><svg><use href="#ico-product"/></svg><span>商品信息</span></a>
    <a class="module" href="../其他内容/PDA商品核实.html" style="text-decoration:none"><svg><use href="#ico-product"/></svg><span>商品核实</span></a>
    <a class="module" href="../其他内容/PDA手工入库签收.html" style="text-decoration:none"><svg><use href="#ico-tag"/></svg><span>手工入库签收</span></a>
    <a class="module" href="../其他内容/PDA手工入库上架.html" style="text-decoration:none"><svg><use href="#ico-up"/></svg><span>手工入库上架</span></a>
  </div>
</section>
</main>
<script>
(function () {
  'use strict';
  var $=function (id) { return document.getElementById(id); };
  var mode='phone', accountValues={phone:'',email:''};
  function refreshHomeLink(event) {
    var link=event.target.closest('a[href]');
    if (!link || !this.contains(link) || link.hasAttribute('download')) return;
    var href=link.getAttribute('href');
    if (!href || href.charAt(0)==='#') return;
    var url=new URL(href,window.location.href);
    if (url.origin!==window.location.origin || !/\.html$/i.test(url.pathname)) return;
    url.searchParams.set('_t',String(Date.now()));
    link.href=url.href;
  }
  ['click','auxclick','contextmenu'].forEach(function (type) {
    $('homeView').addEventListener(type,refreshHomeLink,true);
  });
  window.addEventListener('pageshow',function (event) {
    if (!event.persisted) return;
    var url=new URL(window.location.href);
    url.searchParams.set('_t',String(Date.now()));
    window.location.replace(url.href);
  });
  function showHome(session) {
    $('loginView').hidden=true;
    $('homeView').hidden=false;
    $('screen').classList.add('home-mode');
    $('welcomeName').textContent=session.name || 'XWD';
    $('accountText').textContent=session.account;
    $('accountMenu').hidden=true;
    $('accountButton').setAttribute('aria-expanded','false');
    document.title='PDA - 首页';
  }
  function showLogin() {
    $('homeView').hidden=true;
    $('loginView').hidden=false;
    $('screen').classList.remove('home-mode');
    $('accountMenu').hidden=true;
    $('password').value='';
    document.title='PDA - 登录';
    $('account').focus();
  }
  function setMode(next) {
    if (next===mode) return;
    accountValues[mode]=$('account').value;
    mode=next;
    $('phoneTab').classList.toggle('active',mode==='phone');
    $('emailTab').classList.toggle('active',mode==='email');
    $('phoneTab').setAttribute('aria-selected',String(mode==='phone'));
    $('emailTab').setAttribute('aria-selected',String(mode==='email'));
    $('account').value=accountValues[mode];
    $('account').type=mode==='phone'?'tel':'email';
    $('account').inputMode=mode==='phone'?'numeric':'email';
    if (mode==='phone') $('account').removeAttribute('maxlength');
    else $('account').maxLength=254;
    $('account').autocomplete=mode==='phone'?'tel':'email';
    $('account').placeholder=mode==='phone'?'请输入手机号':'请输入邮箱';
    $('account').setAttribute('aria-label',mode==='phone'?'手机号':'邮箱');
    $('message').textContent='';
    $('account').focus();
  }
  $('phoneTab').addEventListener('click',function () { setMode('phone'); });
  $('emailTab').addEventListener('click',function () { setMode('email'); });
  $('showPassword').addEventListener('click',function () {
    var showing=$('password').type==='password';
    $('password').type=showing?'text':'password';
    this.setAttribute('aria-pressed',String(showing));
    this.setAttribute('aria-label',showing?'隐藏密码':'显示密码');
    $('eyeSlash').style.display=showing?'none':'';
  });
  $('loginForm').addEventListener('submit',function (event) {
    event.preventDefault();
    var account=$('account').value.trim(), password=$('password').value;
    if (mode==='phone' && !/^\d+$/.test(account)) { $('message').textContent='请输入数字'; $('account').focus(); return; }
    if (mode==='email' && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(account)) { $('message').textContent='请输入正确的邮箱'; $('account').focus(); return; }
    if (!password) { $('message').textContent='请输入密码'; $('password').focus(); return; }
    var session={account:account,mode:mode,name:'XWD',loginAt:new Date().toISOString()};
    try { sessionStorage.setItem('erp-pda-session',JSON.stringify(session)); }
    catch (error) { $('message').textContent='无法保存登录状态，请检查浏览器设置'; return; }
    $('message').textContent='';
    showHome(session);
  });
  $('accountButton').addEventListener('click',function () {
    $('accountMenu').hidden=!$('accountMenu').hidden;
    this.setAttribute('aria-expanded',String(!$('accountMenu').hidden));
  });
  $('logoutButton').addEventListener('click',function () {
    sessionStorage.removeItem('erp-pda-session');
    showLogin();
  });
  document.addEventListener('click',function (event) {
    if (!$('accountMenu').hidden && !$('accountMenu').contains(event.target) && !$('accountButton').contains(event.target)) { $('accountMenu').hidden=true; $('accountButton').setAttribute('aria-expanded','false'); }
  });
  try { var session=JSON.parse(sessionStorage.getItem('erp-pda-session') || 'null'); if (session && session.account) showHome(session); } catch (error) {}
})();
</script>
</body>
</html>
