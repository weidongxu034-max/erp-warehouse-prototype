  try{
    for(var p=20;p<=80;p+=20){await pause(180);setProgress(p)}
    await pause(180);downloadCsv(task.name,EXPORT_HEADS,task.rows);task.status='成功';task.completed=formatTime(new Date());write(taskKey,tasks);setProgress(100);await pause(250);closeModal($('#progressMask'));toast('导出成功：商品出库日志导出成功');$('#exportNotification').classList.remove('hidden');
  }catch(e){task.status='失败';task.completed=formatTime(new Date());write(taskKey,tasks);closeModal($('#progressMask'));toast('导出失败，请重试','error')}
  finally{exportBusy=false;$('#exportBtn').disabled=false;if($('#historyMask').classList.contains('show'))renderHistory()}
}
/* ---------- 历史导出任务 ---------- */
function setupHistorySelect(id,options,initial){return ERPComponents.createStaticDropdown({control:id,items:options,value:initial,closeOthers:function(panel){$$('.history-select-panel').forEach(function(other){if(other!==panel)other.classList.add('hidden')});closeDatePickers()}})}
var historyStatusCtl=setupHistorySelect('#historyStatus',['处理中','成功','部分成功','失败'],''),historyNameModeCtl=setupHistorySelect('#historyNameMode',['等于','包含','开头是','结尾是'],'开头是'),historyFileTypeCtl=setupHistorySelect('#historyFileType',['共享文件','普通文件'],''),historyExportTypeCtl=setupHistorySelect('#historyExportType',['实时导出','定时导出'],'');
var historyDateCtl=setupDatePicker({trigger:'#historyDateRange',panel:'#historyDatePicker',shortcuts:'#historyDateShortcuts',grid:'#historyCalGrid',title:'#historyCalTitle',startText:'#historyStartText',endText:'#historyEndText',prevMonth:'#historyPrevMonth',nextMonth:'#historyNextMonth',prevYear:'#historyPrevYear',nextYear:'#historyNextYear'}),historyFiltered=[];
var historyTaskCtl=ERPComponents.createHistoryExportTasks({timeValue:timeValue,timeField:'started'});
function historyStatusClass(status){return status==='成功'?'':status==='处理中'?'processing':status==='部分成功'?'partial':'failed'}
function renderHistory(){
  pruneTasks();var start=historyDateCtl.getStart(),end=historyDateCtl.getEnd(),status=$('#historyStatus').dataset.value,name=$('#historyName').value.trim(),mode=$('#historyNameMode').dataset.value,fileType=$('#historyFileType').dataset.value,exportType=$('#historyExportType').dataset.value;
  if(start&&end&&start>end){toast('开始时间不能晚于结束时间','warning');return}
  historyFiltered=historyTaskCtl.filter(tasks,{start:start,end:end,status:status,name:name,nameMode:mode,fileType:fileType,exportType:exportType});
  $('#historyBody').innerHTML=historyFiltered.length?historyFiltered.map(function(t){return '<tr><td class="center"><input class="history-check" type="checkbox" data-task="'+esc(t.id)+'" '+(state.historySelected.has(t.id)?'checked':'')+'></td><td>'+esc(t.name)+'</td><td>'+esc(t.fileType)+'</td><td>'+esc(t.exportType)+'</td><td>'+esc(t.user)+'</td><td>'+esc(t.started)+'</td><td>'+esc(t.completed||'—')+'</td><td class="center"><span class="status-pill '+historyStatusClass(t.status)+'">'+esc(t.status)+'</span></td><td class="center">'+(t.status==='成功'||t.status==='部分成功'?'<button class="download-link" data-download="'+esc(t.id)+'">下载</button>　':'')+'<button class="danger-link" data-delete-task="'+esc(t.id)+'">删除</button></td></tr>'}).join(''):'<tr><td colspan="9" class="empty-cell">暂无导出任务</td></tr>';
  $('#historyTotal').textContent='共 '+historyFiltered.length+' 条';$('#historyCheckAll').checked=historyFiltered.length>0&&historyFiltered.every(function(t){return state.historySelected.has(t.id)})
}
function resetHistory(){historyStatusCtl.set('');historyNameModeCtl.set('开头是');historyFileTypeCtl.set('');historyExportTypeCtl.set('');$('#historyName').value='';historyDateCtl.reset();state.historySelected.clear();renderHistory()}
/* ---------- 事件绑定 ---------- */
$('#queryForm').addEventListener('submit',function(e){e.preventDefault();applyQuery()});
$('#resetQuery').addEventListener('click',resetQuery);
$('#toggleFilters').addEventListener('click',function(){state.collapsed=!state.collapsed;$$('.frow.collapsible').forEach(function(row){row.classList.toggle('hidden',state.collapsed)});this.textContent=state.collapsed?'展开⌄':'收起⌃'});
$('#keywordText').addEventListener('input',function(){state.batch=[]});
$('#keywordText').addEventListener('focus',function(){if(state.batch.length)this.select()});
$('#keywordField').addEventListener('change',function(){if(state.batch.length){state.batch=[];$('#keywordText').value=''}});
$('#sortTime').addEventListener('click',function(){state.ascending=!state.ascending;state.page=1;$('#sortAsc').classList.toggle('active',state.ascending);$('#sortDesc').classList.toggle('active',!state.ascending);this.setAttribute('aria-label','出库时间，当前'+(state.ascending?'升序':'降序'));computeRows();renderList()});
$('#checkAll').addEventListener('change',function(){var checked=this.checked;currentPageRows().forEach(function(r){if(checked)state.selected.add(r.id);else state.selected.delete(r.id)});renderList()});
$('#logBody').addEventListener('change',function(e){if(!e.target.classList.contains('row-check'))return;var id=e.target.dataset.id;if(e.target.checked)state.selected.add(id);else state.selected.delete(id);e.target.closest('tr').classList.toggle('selected',e.target.checked);updateSelection()});
$('#logBody').addEventListener('click',function(e){var btn=e.target.closest('[data-copy]');if(btn){e.preventDefault();e.stopPropagation();copyText(btn.dataset.copy);return}var link=e.target.closest('[data-detail]');if(link){e.preventDefault();toast('原型演示：详情页将在后续原型中补充','info')}});
$('#pageSize').addEventListener('change',function(){state.pageSize=Number(this.value);state.page=1;renderList()});
$('#exportToggle').addEventListener('click',function(){$('#exportWrap').classList.toggle('open')});
$('#exportBtn').addEventListener('click',createExport);
$('#historyBtn').addEventListener('click',function(){$('#exportWrap').classList.remove('open');renderHistory();openModal('historyMask')});
$('#historyQuery').addEventListener('click',renderHistory);
$('#historyReset').addEventListener('click',resetHistory);
$('#historyCheckAll').addEventListener('change',function(){historyFiltered.forEach(function(t){if($('#historyCheckAll').checked)state.historySelected.add(t.id);else state.historySelected.delete(t.id)});renderHistory()});
$('#historyBody').addEventListener('change',function(e){if(e.target.classList.contains('history-check')){if(e.target.checked)state.historySelected.add(e.target.dataset.task);else state.historySelected.delete(e.target.dataset.task)}});
$('#historyBody').addEventListener('click',function(e){var b=e.target.closest('[data-download]'),del=e.target.closest('[data-delete-task]');if(b){var task=tasks.find(function(t){return t.id===b.dataset.download&&t.accountId===account.id&&(t.status==='成功'||t.status==='部分成功')});if(task){try{downloadCsv(task.name,EXPORT_HEADS,task.rows);toast('文件已下载')}catch(err){toast('下载失败，请重试','error')}}}else if(del){tasks=tasks.filter(function(t){return t.id!==del.dataset.deleteTask});state.historySelected.delete(del.dataset.deleteTask);write(taskKey,tasks);renderHistory();toast('导出任务已删除')}});
$('#historyBatchDelete').addEventListener('click',function(){if(!state.historySelected.size){toast('请先选择导出任务','warning');return}tasks=tasks.filter(function(t){return !state.historySelected.has(t.id)});state.historySelected.clear();write(taskKey,tasks);renderHistory();toast('已批量删除导出任务')});
$('#closeNotification').addEventListener('click',function(){$('#exportNotification').classList.add('hidden')});
document.querySelectorAll('[data-close]').forEach(function(button){button.addEventListener('click',function(){closeModal(button.closest('.mask'))})});
document.querySelectorAll('.mask').forEach(function(mask){mask.addEventListener('click',function(e){if(e.target===mask&&mask.id!=='progressMask')closeModal(mask)})});
document.addEventListener('click',function(e){if(!e.target.closest('#warehouseSelect'))warehouseCtl.close();if(!e.target.closest('#exportWrap'))$('#exportWrap').classList.remove('open');closeDatePickers();$$('.history-select-panel').forEach(function(p){p.classList.add('hidden')})});
document.addEventListener('keydown',function(e){if(e.key!=='Escape'||exportBusy)return;document.querySelectorAll('.mask.show').forEach(closeModal);warehouseCtl.close()});
ERPComponents.createColumnCustomizer({pager:'.pager',table:'.log-table',storageKey:'erp-columns-product-outbound-log',columns:[{key:'thumb',index:2,label:'缩略图'},{key:'info',index:3,label:'出库批次号 / SKU / 中文名称'},{key:'type',index:4,label:'出库类型 / 订单类型 / 发货类型 / 发货分类'},{key:'warehouse',index:5,label:'仓库 / 仓位 / 数量 / 扣减库存'},{key:'time',index:6,label:'出库时间 / 生成任务操作人 / 生成任务时间'}]});
pruneTasks();applyQuery();
})();
</script>
</body>
</html>
