      var calendarStart = dateAdd(first, -offset);

      var end = today;
      if (button.dataset.days != null) {

        end = start;
      } else if (button.dataset.range) {
        start = dateAdd(today, -Number(button.dataset.range) + 1);

      setRange(start, end, true);

    grid.addEventListener('click', function (event) {
      var button = event.target.closest('[data-date]');
      if (!button) return;
      var parts = button.dataset.date.split('-');

        state.start = selected;

  function pageItems(page, count, variant) {
    page = Math.max(1, Math.min(page, count));
    if (variant === 'category') {
      var category = [];

      if (count <= 7) for (categoryIndex = 1; categoryIndex <= count; categoryIndex += 1) category.push({ type: 'page', page: categoryIndex, active: categoryIndex === page });

      }
      return category;
    }
    if (variant === 'neighbor') {
      var neighborValues = [];
      if (count <= 7) for (var neighborIndex = 1; neighborIndex <= count; neighborIndex += 1) neighborValues.push(neighborIndex);
      else {

        if (page > 3) neighborValues.push('ellipsis');
        for (var current = Math.max(2, page - 1); current <= Math.min(count - 1, page + 1); current += 1) neighborValues.push(current);
        if (page < count - 2) neighborValues.push('ellipsis');
        neighborValues.push(count);
      }
      return neighborValues.map(function (value) { return value === 'ellipsis' ? { type: 'ellipsis' } : { type: 'page', page: value, active: value === page }; });
    }
    var numbers = [1, count];
    var number;
    for (number = Math.max(1, page - 2); number <= Math.min(count, page + 2); number += 1) numbers.push(number);
    if (page < 4) for (number = 1; number <= Math.min(5, count); number += 1) numbers.push(number);
    numbers = Array.from(new Set(numbers)).sort(function (a, b) { return a - b; });
    var output = [];
    var last = 0;
    numbers.forEach(function (current) {
      if (last && current - last > 1) output.push({ type: 'ellipsis' });
      output.push({ type: 'page', page: current, active: current === page });
      last = current;
    });
    return output;
  }

  function tip(type, msg) { if (window.toast) window.toast(type, msg); }

  function switchContent(link, label, aside) {
    var main = document.querySelector('.layout > .main');
    if (!main) return;
    document.body.classList.add('erp-hosting-content');
    aside.querySelectorAll('.sub-item.active').forEach(function (item) { item.classList.remove('active'); });
    var targetItem = Array.from(aside.querySelectorAll('.sub-item')).find(function (item) { return item.textContent.trim() === label; });
    if (targetItem) targetItem.classList.add('active');
    if (!contentFrame) {
      contentFrame = document.createElement('iframe');
      contentFrame.className = 'erp-content-frame';
      contentFrame.title = label;
      main.innerHTML = '';
      main.classList.add('erp-content-host');
      main.appendChild(contentFrame);
    }
    clearTimeout(frameTimer);
    contentFrame.classList.remove('ready');
    contentFrame.title = label;
    contentFrame.onload = function () { contentFrame.classList.add('ready'); };
    /* 子页面使用嵌入模式：不重复渲染顶部与侧栏，也不再使用负偏移裁切。 */
    frameTimer = setTimeout(function () {
      contentFrame.src = link + (link.indexOf('?') >= 0 ? '&' : '?') + '_erp_embed=1&_t=' + Date.now();

    document.title = 'ERP - 仓储 - 入库 - ' + label;

    });

    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        document.documentElement.classList.remove('erp-page-loading');
      });
    });

  window.addEventListener('pageshow', function () {
    document.documentElement.classList.remove('erp-page-loading');
  });

  if (document.body) render();
  else document.addEventListener('DOMContentLoaded', render);
})();

</script>

    root.innerHTML='<div class="cc-page-'+type+'"><section class="cc-card cc-filter"><div class="cc-filter-grid"><div class="cc-field"><label>'+filterName+'</label><input class="cc-input" id="ccFilterCode" placeholder="请输入"></div><div class="cc-field"><label>'+(!isTask?'篮子类型':'任务类型')+'</label><div class="floating-select" id="ccTypeSelect"></div></div><div class="cc-field cc-time"><label>操作时间</label>'+dateMarkup()+'</div><div class="cc-filter-actions"><button class="cc-btn" id="ccReset">重置</button><button class="cc-btn primary" id="ccSearch">查询</button></div></div></section><section class="cc-card cc-table-card"><div class="cc-toolbar"><button class="cc-btn primary" id="ccAdd">新增'+(isTask?'任务头':'篮子')+'</button><button class="cc-btn link" id="ccPrintSettings">▣ 打印设置</button></div><div class="cc-table-wrap"><table class="cc-table">'+(isTask?'<colgroup><col style="width:42px"><col style="width:84px"><col style="width:84px"><col><col style="width:167px"><col style="width:217px"></colgroup><thead><tr><th>序号</th><th>任务头</th><th>任务类型</th><th>操作人</th><th class="cc-center">操作时间</th><th class="cc-center">操作</th></tr></thead>':'<colgroup><col style="width:67px"><col style="width:66px"><col style="width:100px"><col><col><col style="width:167px"><col style="width:217px"></colgroup><thead><tr><th>序号</th><th>篮子头</th><th>篮子类型</th><th>操作人</th><th>发货员</th><th class="cc-center">操作时间</th><th class="cc-center">操作</th></tr></thead>')+'<tbody id="ccBody"></tbody></table></div></section></div>';
    const pager=document.createElement('div');pager.className='cc-pager';pager.id='ccPager';document.body.appendChild(pager);
    E.createStickyTableHeader({table:'.cc-table',wrapper:'.cc-table-wrap',scrollContainer:'.layout > .main',zIndex:20});

    document.addEventListener('click',e=>{if(!e.target.closest('.cc-time'))datePicker.close();});
  }
  function applyFilter(){const code=root.querySelector('#ccFilterCode').value.trim().toLowerCase();const category=typeSelect.getValue();const start=datePicker.getStart(),end=datePicker.getEnd();filtered=rows.filter(row=>(!code||row.code.toLowerCase().includes(code))&&(!category||row.category===category)&&(!start||new Date(row.time.replace(/-/g,'/')).getTime()>=start)&&(!end||new Date(row.time.replace(/-/g,'/')).getTime()<=end));page=1;renderTable();}
  function renderTable(){
    const totalPages=Math.max(1,Math.ceil(filtered.length/size));page=Math.max(1,Math.min(page,totalPages));
    const visible=filtered.slice((page-1)*size,page*size);
    root.querySelector('#ccBody').innerHTML=visible.length?visible.map((row,i)=>'<tr><td>'+((page-1)*size+i+1)+'</td><td>'+escape(row.code)+'</td><td>'+escape(row.category)+'</td><td>'+escape(row.operator)+'</td>'+(isTask?'':'<td>'+escape(row.sender||'')+' <a class="cc-edit-person" data-action="edit-sender" data-id="'+escape(row.id)+'" title="编辑发货员">✎</a></td>')+'<td class="cc-center">'+escape(row.time)+'</td><td class="cc-actions"><div class="cc-ops"><a data-action="preview" data-id="'+escape(row.id)+'">有效'+(isTask?'任务码':'篮子码')+'</a><a data-action="print" data-id="'+escape(row.id)+'">打印'+(isTask?'任务':'篮子')+'条码</a><a class="cc-delete" data-action="delete" data-id="'+escape(row.id)+'">删除</a></div></td></tr>').join(''):'<tr><td class="cc-empty" colspan="'+(isTask?6:7)+'">暂无数据</td></tr>';
    const pageButtons=[];const left=Math.max(1,page-2),right=Math.min(totalPages,Math.max(page+2,5));for(let p=left;p<=right;p++)pageButtons.push('<button data-page="'+p+'" class="'+(p===page?'active':'')+'">'+p+'</button>');

  }
  function modal(title,content,confirm){modalHost.innerHTML='<div class="cc-modal-mask"><div class="cc-modal" role="dialog" aria-modal="true"><div class="cc-modal-head"><span>'+title+'</span><button class="cc-modal-close" data-close>×</button></div>'+content+'<div class="cc-modal-foot"><button class="cc-btn" data-close>取消</button><button class="cc-btn primary" id="ccModalConfirm">确定</button></div></div></div>';modalHost.querySelector('#ccModalConfirm').addEventListener('click',confirm);const first=modalHost.querySelector('input');if(first)first.focus();}
  function closeModal(){modalHost.innerHTML='';}
  function addRow(){
    const categories=isTask?['上架任务','配货任务']:['发货分拣篮子','退货分拣篮子'];
    const content='<div class="cc-modal-field"><label><span class="cc-required">*</span> '+(isTask?'任务头':'篮子头')+'</label><input class="cc-input" id="ccNewCode" placeholder="请输入"></div>'+
      '<div class="cc-modal-field"><label><span class="cc-required">*</span> '+(isTask?'任务类型':'篮子类型')+'</label><select class="cc-select" id="ccNewType">'+categories.map(x=>'<option>'+x+'</option>').join('')+'</select></div>'+
      (isTask?'':'<div class="cc-modal-field"><label>发货员</label><select class="cc-select" id="ccNewSender"><option value="" disabled hidden selected>请选择</option>'+['XWD','WSQ','HF','LS','SXY','Laity'].map(x=>'<option>'+x+'</option>').join('')+'</select></div>');
    modal(isTask?'新增任务类型':'新增篮子',content,()=>{
      const code=modalHost.querySelector('#ccNewCode').value.trim();
      if(!code){toast('请输入'+(isTask?'任务头':'篮子头'));modalHost.querySelector('#ccNewCode').focus();return;}
      const category=modalHost.querySelector('#ccNewType').value;
      if(!category){toast('请选择'+(isTask?'任务类型':'篮子类型'));return;}
      const row={id:type+Date.now(),code,category,operator:'XWD',time:new Date().toLocaleString('sv-SE').replace('T',' ')};
      if(!isTask)row.sender=modalHost.querySelector('#ccNewSender').value;
      rows.unshift(row);save();closeModal();applyFilter();
    });
    modalHost.querySelector('.cc-modal').classList.add('cc-modal-create');
  }
  function preview(row,printing){modal('有效'+(isTask?'任务码':'篮子码'),'<div class="cc-modal-note">'+(isTask?'任务头':'篮子头')+'：'+escape(row.code)+'</div><div class="cc-barcode" aria-hidden="true"></div><div class="cc-code-text">'+escape(row.code)+'</div>',()=>{if(printing)window.print();closeModal();});}
  root.addEventListener('click',e=>{
    const el=e.target.closest('[data-action],#ccSearch,#ccReset,#ccAdd,#ccPrintSettings');if(!el)return;
    if(el.id==='ccSearch')return applyFilter();
    if(el.id==='ccReset'){root.querySelector('#ccFilterCode').value='';typeSelect.setValue('');datePicker.reset();return applyFilter();}
    if(el.id==='ccAdd')return addRow();
    if(el.id==='ccPrintSettings')return modal('打印设置','<div class="cc-modal-field"><label>打印份数</label><input class="cc-input" type="number" min="1" value="1"></div>',()=>{closeModal();toast('打印设置已保存');});
    const row=rows.find(x=>x.id===el.dataset.id);if(!row)return;
    if(el.dataset.action==='delete'){if(!confirm('确定删除 '+row.code+' 吗？'))return;rows=rows.filter(x=>x.id!==row.id);save();applyFilter();return;}
    if(el.dataset.action==='preview')return preview(row,false);
    if(el.dataset.action==='print')return preview(row,true);
    if(el.dataset.action==='edit-sender')return modal('编辑发货员','<div class="cc-modal-field"><label>发货员</label><input class="cc-input" id="ccSender" value="'+escape(row.sender||'')+'" placeholder="请输入"></div>',()=>{row.sender=modalHost.querySelector('#ccSender').value.trim();save();closeModal();renderTable();});
  });
  modalHost.addEventListener('click',e=>{if(e.target.classList.contains('cc-modal-mask')||e.target.closest('[data-close]'))closeModal();});
  document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
  document.body.addEventListener('click',e=>{const btn=e.target.closest('#ccPager [data-page]');if(!btn||btn.disabled)return;page=Number(btn.dataset.page);renderTable();});
  document.body.addEventListener('change',e=>{if(e.target.id==='ccPageSize'){size=Number(e.target.value);page=1;renderTable();}});
  document.body.addEventListener('keydown',e=>{if(e.target.id==='ccJump'&&e.key==='Enter'){page=Math.max(1,Number(e.target.value)||1);renderTable();}});
  skeleton();renderTable();
})();

  function shell(){root.innerHTML='<div class="rs-page"><section class="rs-card rs-warehouse"><div class="rs-search"><input id="warehouseSearch" placeholder="请输入名称搜索"><button type="button" aria-label="搜索">⌕</button></div><div class="rs-warehouse-list" id="warehouseList"></div></section><section class="rs-card rs-content"><div class="rs-filter"><div class="rs-field"><label for="shelfFilter">货架编号</label><input class="rs-input" id="shelfFilter" placeholder="双击可批量查询"></div><div class="rs-field"><label>商品分类</label><button class="rs-select-trigger placeholder" id="categoryFilter" type="button">请选择</button><div id="filterPickerHost"></div></div><div class="rs-filter-actions"><button class="rs-btn" id="resetButton" type="button">重置</button><button class="rs-btn primary" id="searchButton" type="button">查询</button></div></div><div class="rs-toolbar"><button class="rs-btn primary" id="batchButton" type="button">批量修改</button></div><div class="rs-table-wrap"><table class="rs-table"><colgroup><col style="width:42px"><col style="width:42px"><col style="width:162px"><col></colgroup><thead><tr><th class="rs-center"><input id="selectAll" type="checkbox"></th><th class="rs-center">序号</th><th>货架编号　<span style="float:right;color:#a4a9b1">◆</span></th><th>商品分类 <span style="float:right;color:#a4a9b1">◆</span></th></tr></thead><tbody id="shelfBody"></tbody></table></div><div class="rs-pager"><span id="totalText">共 0 条</span><button type="button">‹</button><button class="active" type="button">1</button><button type="button">›</button><select><option>100 条/页</option></select></div></section></div>'}

  function filteredRows(){return (shelfRows[currentWarehouse]||[]).filter(function(row){return(!appliedShelf||row.code.toLowerCase().includes(appliedShelf))&&(!appliedCategory||row.category===appliedCategory)})}

<script>

  const categoryTree=[
    {name:'肯德基',children:[{name:'食品',children:[{name:'炸鸡'},{name:'汉堡'}]},{name:'饮品',children:[{name:'咖啡'},{name:'果汁'}]}]},
    {name:'麦当劳',children:[{name:'食品',children:[{name:'薯条'},{name:'汉堡'}]},{name:'玩具'}]},
    {name:'AutDx_更新分类fa577',children:[{name:'测试子分类A'},{name:'测试子分类B'}]},
    {name:'AutDx_更新分类a1888',children:[{name:'一级子类',children:[{name:'二级子类'}]}]},
    {name:'AutDx_商品一级分类26cec',children:[{name:'服饰'},{name:'配件'}]},

    {name:'服装',children:[{name:'女装'},{name:'男装'}]},
    {name:'家居用品',children:[{name:'收纳'},{name:'清洁'}]},
    {name:'数码配件',children:[{name:'手机配件'},{name:'电脑配件'}]}
  ];
  const escapeHtml=value=>String(value==null?'':value).replace(/[&<>'"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
  const samePath=(a,b)=>a.length===b.length&&a.every((part,index)=>part===b[index]);
  const pathStartsWith=(path,prefix)=>prefix.every((part,index)=>path[index]===part);
  function nodeAt(path){let nodes=categoryTree,node=null;for(const name of path){node=nodes.find(item=>item.name===name);if(!node)return null;nodes=node.children||[]}return node}
  function selection(path){const node=nodeAt(path);return node?{path:path.slice(),includeChildren:!!(node.children&&node.children.length)}:null}
  function displayCategory(value){if(value&&value.unset)return '未设置分类';return value&&value.path.length?value.path.join(' / ')+(value.includeChildren?'（含全部下级）':''):'--'}
  function flattenCategories(nodes,parentPath,result){result=result||[];(nodes||[]).forEach(node=>{const path=parentPath.concat(node.name);result.push({path,level:path.length});flattenCategories(node.children||[],path,result)});return result}
  const flatCategories=[{path:[],level:0,unset:true}].concat(flattenCategories(categoryTree,[]));
  function highlightSearch(text,query){const source=String(text),needle=String(query).toLowerCase();if(!needle)return escapeHtml(source);let html='',cursor=0,index=source.toLowerCase().indexOf(needle);while(index>=0){html+=escapeHtml(source.slice(cursor,index))+'<span class="rs-search-hit">'+escapeHtml(source.slice(index,index+needle.length))+'</span>';cursor=index+needle.length;index=source.toLowerCase().indexOf(needle,cursor)}return html+escapeHtml(source.slice(cursor))}

  warehouses.forEach((name,index)=>{const first=categoryTree[index%categoryTree.length];shelfRows[name]=[{id:'s-'+index+'-1',code:index===3?'A01':'A'+String(index+1).padStart(2,'0'),category:index===3?null:selection([first.name])}]});
  shelfRows['验证仓'].push({id:'s-2-2',code:'B02',category:selection(['数码配件','手机配件'])});
  let currentWarehouse='云县中仓',filterCategory=null,appliedShelf='',appliedCategory=null,openPicker=null,batchCategory=null,batchClearExisting=false,selected=new Set();
  function toast(message){document.querySelector('.rs-toast')?.remove();const el=document.createElement('div');el.className='rs-toast';el.textContent=message;document.body.appendChild(el);setTimeout(()=>el.remove(),1800)}
  function selectedValue(kind,rowId){if(kind==='filter')return filterCategory;if(kind==='batch')return batchCategory;return (shelfRows[currentWarehouse].find(row=>row.id===rowId)||{}).category||null}
  function openCascade(kind,rowId){const value=selectedValue(kind,rowId);openPicker={kind,rowId:rowId||'',expandedPath:value?value.path.slice():[],query:'',openedAt:Date.now()}}
  function restoreSelectedView(){requestAnimationFrame(()=>{document.querySelectorAll('[data-picker] .rs-cascade-item.in-path,[data-picker] .rs-cascade-item.selected').forEach(item=>item.scrollIntoView({block:'nearest',inline:'nearest'}))})}
  function focusCategoryInput(kind,rowId,selectText){requestAnimationFrame(()=>{const scope=kind==='batch'?modalHost:root,input=scope.querySelector('[data-category-search="'+kind+'"]'+(rowId?'[data-row-id="'+CSS.escape(rowId)+'"]':''));if(!input)return;input.focus();if(selectText)input.select()})}
  function cascadeMarkup(kind,rowId){
    const value=selectedValue(kind,rowId),expanded=openPicker?openPicker.expandedPath:[],query=openPicker?openPicker.query.trim():'',columns=[];
    if(query){const lowered=query.toLowerCase(),results=flatCategories.filter(item=>(kind==='filter'||!item.unset)&&(item.unset?'未设置分类':item.path.join(' / ')).toLowerCase().includes(lowered));return '<div class="rs-picker cascade-picker '+(kind==='filter'?'filter-picker':kind==='row'?'row-picker':'batch-picker')+'" data-picker><div class="rs-category-search-results">'+(results.length?results.map(item=>{const fullPath=item.unset?'未设置分类':item.path.join(' / '),isSelected=item.unset?!!(value&&value.unset):!!value&&!value.unset&&samePath(value.path,item.path);return '<button class="rs-category-search-item '+(isSelected?'selected':'')+'" type="button" '+(item.unset?'data-category-unset':'data-category-select="'+encodedPath(item.path)+'"')+' title="'+escapeHtml(fullPath)+'"><span class="rs-search-path">'+highlightSearch(fullPath,query)+'</span></button>'}).join(''):'<div class="rs-category-search-empty">暂无匹配分类</div>')+'</div></div>'}
    let nodes=categoryTree,parentPath=[];
    while(nodes&&nodes.length){
      const items=nodes.map(node=>{const itemPath=parentPath.concat(node.name),hasChildren=!!(node.children&&node.children.length),isSelected=!!value&&samePath(value.path,itemPath),inPath=pathStartsWith(expanded,itemPath);return '<div class="rs-cascade-item '+(isSelected?'selected ':'')+(inPath?'in-path':'')+'" data-cascade-item="'+encodedPath(itemPath)+'"><button class="rs-category-name" type="button" data-category-select="'+encodedPath(itemPath)+'" title="'+escapeHtml(node.name)+'">'+escapeHtml(node.name)+'</button>'+(hasChildren?'<button class="rs-category-expand" type="button" data-category-expand="'+encodedPath(itemPath)+'" aria-label="展开下一级">›</button>':'')+'</div>'}).join('');
      const unsetItem=parentPath.length||kind!=='filter'?'':'<div class="rs-cascade-item rs-cascade-unset '+(value&&value.unset?'selected':'')+'"><button class="rs-category-name" type="button" data-category-unset>未设置分类</button></div>';
      columns.push('<div class="rs-cascade-column">'+unsetItem+items+'</div>');
      const nextName=expanded[parentPath.length],nextNode=nodes.find(node=>node.name===nextName);if(!nextNode||!nextNode.children||!nextNode.children.length)break;parentPath=parentPath.concat(nextNode.name);nodes=nextNode.children;
    }
    return '<div class="rs-picker cascade-picker '+(kind==='filter'?'filter-picker':kind==='row'?'row-picker':'batch-picker')+'" data-picker><div class="rs-cascade-hint">悬浮或点击箭头展开下级；点击分类名称直接选择</div><div class="rs-cascade">'+columns.join('')+'</div></div>';
  }
  function shell(){root.innerHTML='<div class="rs-page"><section class="rs-card rs-warehouse"><div class="rs-search"><input id="warehouseSearch" placeholder="请输入名称搜索"><button type="button" aria-label="搜索">⌕</button></div><div class="rs-warehouse-list" id="warehouseList"></div></section><section class="rs-card rs-content"><div class="rs-filter"><div class="rs-field"><label for="shelfFilter">货架编号</label><input class="rs-input" id="shelfFilter" placeholder="双击可批量查询"></div><div class="rs-field"><label>商品分类</label><div class="rs-category-input-wrap" data-category-trigger="filter"><input class="rs-category-search-input" id="categoryFilter" data-category-search="filter" placeholder="请选择" autocomplete="off"><span class="rs-input-clear" id="filterCategoryClear" data-input-clear="filter" role="button" aria-label="清空商品分类" hidden>×</span><span class="rs-input-arrow">⌄</span></div><div id="filterPickerHost"></div></div><div class="rs-filter-actions"><button class="rs-btn" id="resetButton" type="button">重置</button><button class="rs-btn primary" id="searchButton" type="button">查询</button></div></div><div class="rs-toolbar"><button class="rs-btn primary" id="batchButton" type="button">批量修改</button></div><div class="rs-table-wrap"><table class="rs-table"><colgroup><col style="width:42px"><col style="width:42px"><col style="width:162px"><col></colgroup><thead><tr><th class="rs-center"><input id="selectAll" type="checkbox"></th><th class="rs-center">序号</th><th>货架编号　<span style="float:right;color:#a4a9b1">◆</span></th><th>商品分类 <span style="float:right;color:#a4a9b1">◆</span></th></tr></thead><tbody id="shelfBody"></tbody></table></div><div class="rs-pager"><span id="totalText">共 0 条</span><button type="button">‹</button><button class="active" type="button">1</button><button type="button">›</button><select><option>100 条/页</option></select></div></section></div>'}
  function renderWarehouses(){const keyword=document.getElementById('warehouseSearch').value.trim().toLowerCase();document.getElementById('warehouseList').innerHTML=warehouses.filter(name=>!keyword||name.toLowerCase().includes(keyword)).map(name=>'<button class="rs-warehouse-item '+(name===currentWarehouse?'active':'')+'" type="button" data-warehouse="'+escapeHtml(name)+'">'+escapeHtml(name)+'</button>').join('')||'<div class="rs-empty">暂无匹配仓库</div>'}
  function categoryMatches(value,filter){if(!filter)return true;if(filter.unset)return !value;if(!value)return false;return filter.includeChildren?pathStartsWith(value.path,filter.path):samePath(value.path,filter.path)}
  function filteredRows(){return(shelfRows[currentWarehouse]||[]).filter(row=>(!appliedShelf||row.code.toLowerCase().includes(appliedShelf))&&categoryMatches(row.category,appliedCategory))}
  function renderFilter(){const input=document.getElementById('categoryFilter'),searching=openPicker&&openPicker.kind==='filter'&&openPicker.query,text=filterCategory?displayCategory(filterCategory):'';input.value=searching?openPicker.query:text;input.title=filterCategory?text:'';document.getElementById('filterCategoryClear').hidden=!filterCategory;document.getElementById('filterPickerHost').innerHTML=openPicker&&openPicker.kind==='filter'?cascadeMarkup('filter',''):''}
  function renderTable(){const rows=filteredRows();document.getElementById('shelfBody').innerHTML=rows.length?rows.map((row,index)=>{const isOpen=openPicker&&openPicker.kind==='row'&&openPicker.rowId===row.id,inputValue=isOpen&&openPicker.query?openPicker.query:(row.category?displayCategory(row.category):'');return '<tr class="'+(isOpen?'rs-row-active':'')+'"><td class="rs-center"><input type="checkbox" data-row-select="'+escapeHtml(row.id)+'" '+(selected.has(row.id)?'checked':'')+'></td><td class="rs-center">'+(index+1)+'</td><td>'+escapeHtml(row.code)+'</td><td class="rs-category-cell"><div class="rs-category-input-wrap rs-table-category-wrap" data-category-trigger="row" data-row-id="'+escapeHtml(row.id)+'"><input class="rs-category-search-input" data-category-search="row" data-row-id="'+escapeHtml(row.id)+'" value="'+escapeHtml(inputValue)+'" placeholder="请选择" autocomplete="off" title="'+escapeHtml(row.category?displayCategory(row.category):'')+'">'+(row.category?'<span class="rs-input-clear" data-input-clear="row" data-row-id="'+escapeHtml(row.id)+'" role="button" aria-label="清空商品分类">×</span>':'')+'<span class="rs-input-arrow">⌄</span></div><div data-picker-host>'+(isOpen?cascadeMarkup('row',row.id):'')+'</div></td></tr>'}).join(''):'<tr><td class="rs-empty" colspan="4">暂无数据</td></tr>';document.getElementById('totalText').textContent='共 '+rows.length+' 条';document.getElementById('selectAll').checked=rows.length>0&&rows.every(row=>selected.has(row.id))}
  function renderPagePickers(){renderFilter();renderTable()}
  function renderBatchModal(){const searching=openPicker&&openPicker.kind==='batch'&&openPicker.query,inputValue=searching?openPicker.query:(batchCategory?displayCategory(batchCategory):'');modalHost.innerHTML='<div class="rs-mask"><div class="rs-modal rs-cascade-modal" role="dialog" aria-modal="true"><div class="rs-modal-head"><span>批量修改</span><button type="button" data-modal-close>×</button></div><div class="rs-batch-summary">已选 <strong>'+selected.size+'</strong> 个货架，请选择商品分类，<br>如需清空货架已有分类，请选择[清空原有分类]</div><div class="rs-field rs-batch-field"><label>商品分类</label><div class="rs-batch-controls"><div class="rs-category-input-wrap rs-batch-category-control" data-category-trigger="batch"><input class="rs-category-search-input" id="batchCategoryTrigger" data-category-search="batch" value="'+escapeHtml(inputValue)+'" placeholder="请选择" autocomplete="off" '+(batchClearExisting?'disabled':'')+'>'+(batchCategory&&!batchClearExisting?'<span class="rs-input-clear" data-input-clear="batch" role="button" aria-label="清空商品分类">×</span>':'')+'<span class="rs-input-arrow">⌄</span><div data-picker-host>'+(openPicker&&openPicker.kind==='batch'?cascadeMarkup('batch',''):'')+'</div></div><label class="rs-clear-existing"><input id="batchClearExisting" type="checkbox" '+(batchClearExisting?'checked':'')+'>清空原有分类</label></div></div><div class="rs-modal-foot"><button class="rs-btn" type="button" data-modal-close>取消</button><button class="rs-btn primary" id="batchConfirm" type="button">确定</button></div></div></div>'}
  function closePicker(){const wasBatch=openPicker&&openPicker.kind==='batch';openPicker=null;wasBatch?renderBatchModal():renderPagePickers()}
  function applyCategory(path){const value=selection(path);if(!value)return;if(openPicker.kind==='filter')filterCategory=value;else if(openPicker.kind==='batch')batchCategory=value;else{const row=shelfRows[currentWarehouse].find(item=>item.id===openPicker.rowId);if(row)row.category=value}closePicker()}
  function applyUnsetCategory(){if(openPicker.kind==='filter')filterCategory={unset:true,path:[],includeChildren:false};else if(openPicker.kind==='batch')batchCategory={unset:true,path:[],includeChildren:false};else{const row=shelfRows[currentWarehouse].find(item=>item.id===openPicker.rowId);if(row)row.category=null}closePicker()}
  function clearInput(kind,rowId){if(kind==='filter')filterCategory=null;else if(kind==='batch')batchCategory=null;else{const row=shelfRows[currentWarehouse].find(item=>item.id===rowId);if(row)row.category=null}openPicker=null;kind==='batch'?renderBatchModal():renderPagePickers()}
  function expandCategory(path){const node=nodeAt(path);if(!node||!node.children||!node.children.length)return;if(samePath(openPicker.expandedPath,path))return;openPicker.expandedPath=path.slice();openPicker.kind==='batch'?renderBatchModal():renderPagePickers()}
  function categoryAction(event){if(event.target.closest('[data-category-unset]')){applyUnsetCategory();return true}const selectButton=event.target.closest('[data-category-select]');if(selectButton){applyCategory(decodedPath(selectButton.dataset.categorySelect));return true}const expandButton=event.target.closest('[data-category-expand]');if(expandButton){expandCategory(decodedPath(expandButton.dataset.categoryExpand));return true}return false}
  function categoryHover(event){const item=event.target.closest('[data-cascade-item]');if(!item||!openPicker||openPicker.query||Date.now()-openPicker.openedAt<300)return;expandCategory(decodedPath(item.dataset.cascadeItem))}
  function updateCategorySearch(event){const input=event.target.closest('[data-category-search]');if(!input)return false;const kind=input.dataset.categorySearch,rowId=input.dataset.rowId||'';if(!openPicker||openPicker.kind!==kind||openPicker.rowId!==rowId)openCascade(kind,rowId);openPicker.query=input.value;const host=kind==='filter'?document.getElementById('filterPickerHost'):input.closest(kind==='batch'?'.rs-batch-field':'.rs-category-cell').querySelector('[data-picker-host]');host.innerHTML=cascadeMarkup(kind,rowId);return true}
  function activateCategoryInput(event){const input=event.target.closest('[data-category-search]');if(!input)return;const kind=input.dataset.categorySearch,rowId=input.dataset.rowId||'';if(openPicker&&openPicker.kind===kind&&openPicker.rowId===rowId)return;openCascade(kind,rowId);kind==='batch'?renderBatchModal():renderPagePickers();restoreSelectedView();focusCategoryInput(kind,rowId,true)}
  function openBatch(){if(!selected.size){toast('请先勾选货架');return}batchCategory=null;batchClearExisting=false;openPicker=null;renderBatchModal()}
  shell();renderWarehouses();renderFilter();renderTable();
  root.addEventListener('input',event=>{if(event.target.id==='warehouseSearch'){renderWarehouses();return}updateCategorySearch(event)});
  root.addEventListener('focusin',activateCategoryInput);
  root.addEventListener('mouseover',categoryHover);
  root.addEventListener('change',event=>{if(event.target.matches('[data-row-select]')){event.target.checked?selected.add(event.target.dataset.rowSelect):selected.delete(event.target.dataset.rowSelect);renderTable();return}if(event.target.id==='selectAll'){filteredRows().forEach(row=>event.target.checked?selected.add(row.id):selected.delete(row.id));renderTable()}});
  root.addEventListener('click',event=>{const clear=event.target.closest('[data-input-clear]');if(clear){event.preventDefault();event.stopPropagation();clearInput(clear.dataset.inputClear,clear.dataset.rowId||'');return}if(categoryAction(event))return;const warehouse=event.target.closest('[data-warehouse]');if(warehouse){currentWarehouse=warehouse.dataset.warehouse;selected.clear();openPicker=null;appliedShelf='';appliedCategory=null;filterCategory=null;document.getElementById('shelfFilter').value='';renderWarehouses();renderPagePickers();return}const trigger=event.target.closest('[data-category-trigger]');if(trigger){const kind=trigger.dataset.categoryTrigger,rowId=trigger.dataset.rowId||'';if(!openPicker||openPicker.kind!==kind||openPicker.rowId!==rowId){openCascade(kind,rowId);renderPagePickers();restoreSelectedView()}focusCategoryInput(kind,rowId,event.target.closest('.rs-input-arrow')!==null);return}if(event.target.closest('#searchButton')){appliedShelf=document.getElementById('shelfFilter').value.trim().toLowerCase();appliedCategory=filterCategory?{path:filterCategory.path.slice(),includeChildren:filterCategory.includeChildren,unset:!!filterCategory.unset}:null;selected.clear();closePicker();return}if(event.target.closest('#resetButton')){document.getElementById('shelfFilter').value='';filterCategory=null;appliedShelf='';appliedCategory=null;selected.clear();closePicker();return}if(event.target.closest('#batchButton'))openBatch()});
  modalHost.addEventListener('mouseover',categoryHover);
  modalHost.addEventListener('input',updateCategorySearch);
  modalHost.addEventListener('focusin',activateCategoryInput);
  modalHost.addEventListener('change',event=>{if(event.target.id!=='batchClearExisting')return;batchClearExisting=event.target.checked;if(batchClearExisting){batchCategory=null;openPicker=null}renderBatchModal()});
  modalHost.addEventListener('click',event=>{const clear=event.target.closest('[data-input-clear]');if(clear){event.preventDefault();event.stopPropagation();clearInput(clear.dataset.inputClear,'');return}if(categoryAction(event))return;if(event.target.classList.contains('rs-mask')||event.target.closest('[data-modal-close]')){modalHost.innerHTML='';openPicker=null;return}const trigger=event.target.closest('[data-category-trigger="batch"]');if(trigger){if(batchClearExisting)return;if(!openPicker||openPicker.kind!=='batch'){openCascade('batch','');renderBatchModal();restoreSelectedView()}focusCategoryInput('batch','',event.target.closest('.rs-input-arrow')!==null);return}if(event.target.id==='batchConfirm'){if(!batchClearExisting&&!batchCategory){toast('请选择商品分类');return}Object.values(shelfRows).flat().forEach(row=>{if(selected.has(row.id))row.category=batchClearExisting?null:{path:batchCategory.path.slice(),includeChildren:batchCategory.includeChildren}});modalHost.innerHTML='';openPicker=null;renderTable();toast('批量修改成功')}});
  document.addEventListener('click',event=>{if(openPicker&&!event.target.closest('[data-picker],[data-category-trigger]'))closePicker()});
})();
</script>
