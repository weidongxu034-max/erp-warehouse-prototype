<script>
(function(){

var RECORD_KEY='erp.shippingCategory.records.v1';

  {id:'FC009',name:'转爆款操作Aa3',desc:'',enabled:false,handlers:[],mode:'正选',createdAt:'2026-09-09 16:40:00'},
  {id:'FC008',name:'CLF-2',desc:'',enabled:false,handlers:['HQ'],mode:'正选',createdAt:'2026-09-08 15:32:00'},
  {id:'FC007',name:'YP集成环境发货分类3',desc:'',enabled:true,handlers:['YCS'],mode:'正选',createdAt:'2026-09-07 13:25:00'},
  {id:'FC006',name:'YP集成环境发货分类2',desc:'',enabled:true,handlers:[],mode:'正选',createdAt:'2026-09-06 10:18:00'},
  {id:'FC005',name:'YP集成环境发货分类1',desc:'',enabled:true,handlers:['ABC'],mode:'正选',createdAt:'2026-09-05 17:05:00'},
  {id:'FC004',name:'YCS',desc:'',enabled:true,handlers:['YCS'],mode:'正选',createdAt:'2026-09-04 12:15:00'},
  {id:'FC003',name:'HQ',desc:'',enabled:true,handlers:['HQ'],mode:'正选',createdAt:'2026-09-03 10:00:00'},

];
function readJSON(key,fallback){try{var v=localStorage.getItem(key);return v?JSON.parse(v):fallback}catch(e){return fallback}}
function saveJSON(key,value){try{localStorage.setItem(key,JSON.stringify(value))}catch(e){}}
var mockRecords=Array.from({length:100},function(_,i){
  var n=i+1,d=new Date(2026,8,13,23,59-i,0),p=function(v){return String(v).padStart(2,'0')};
  return{id:'MOCK-'+String(n).padStart(3,'0'),name:'模拟发货分类'+String(n).padStart(3,'0'),desc:'用于列表与分页交互测试的模拟数据',enabled:i%4!==3,handlers:i%3===0?[PEOPLE[i%PEOPLE.length]]:[],mode:'正选',createdAt:d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds())}
});
var records=readJSON(RECORD_KEY,seed).slice();
if(!readJSON(MOCK_KEY,false)){
  mockRecords.forEach(function(r){var old=records.find(function(x){return x.id===r.id});old?old.createdAt=r.createdAt:records.push(r)});
  saveJSON(RECORD_KEY,records);saveJSON(MOCK_KEY,true)
}
var visible=readJSON(COLUMN_KEY,COLUMNS.map(function(c){return c.key}));
visible=visible.filter(function(k){return COLUMNS.some(function(c){return c.key===k})});
var columnWidths=readJSON(WIDTH_KEY,{});COLUMNS.forEach(function(c){var n=Number(columnWidths[c.key]);columnWidths[c.key]=Number.isFinite(n)?Math.max(c.min,Math.min(c.max,n)):c.width});
var pageSize=parseInt(localStorage.getItem(SIZE_KEY),10);if([10,20,30,50,100,200,500].indexOf(pageSize)<0)pageSize=100;
var page=1,query='',selectedId=null,draftHandlers=[],newDraftHandlers=[];
var $=function(s,root){return(root||document).querySelector(s)};
var workspace=$('.workspace'),savedListWidth=Number(readJSON(LIST_WIDTH_KEY,0));if(Number.isFinite(savedListWidth)&&savedListWidth>0)workspace.style.setProperty('--list-width',savedListWidth+'px');
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function sorted(){return records.slice().sort(function(a,b){return String(b.createdAt).localeCompare(String(a.createdAt))})}
function filtered(){var q=query.toLowerCase();return sorted().filter(function(r){return !q||r.name.toLowerCase().indexOf(q)>-1})}
function nowText(){var d=new Date(),p=function(n){return String(n).padStart(2,'0')};return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds())}
function toast(text,type){var el=document.createElement('div');el.className='toast '+(type||'success');el.textContent=text;$('#toastWrap').appendChild(el);setTimeout(function(){el.remove()},1800)}
function activeColumns(){return COLUMNS.filter(function(c){return visible.indexOf(c.key)>-1})}
function renderColumns(){
  var cols=activeColumns();
  $('#colgroup').innerHTML=cols.map(function(c){return '<col data-col="'+c.key+'" style="width:'+columnWidths[c.key]+'px">'}).join('');
  $('#tableHead').innerHTML=cols.map(function(c){return '<th>'+c.label+'<span class="resize-handle" data-resize="'+c.key+'" title="拖动调整列宽" aria-label="调整'+c.label+'列宽"></span></th>'}).join('');
  $('#columnOptions').innerHTML=COLUMNS.map(function(c){return '<label><input type="checkbox" data-column="'+c.key+'" '+(visible.indexOf(c.key)>-1?'checked':'')+'><span>'+c.label+'</span></label>'}).join('');
}
function renderTable(){
  renderColumns();var list=filtered(),pages=Math.max(1,Math.ceil(list.length/pageSize));if(page>pages)page=pages;
  var start=(page-1)*pageSize,rows=list.slice(start,start+pageSize),cols=activeColumns();
  $('#tableBody').innerHTML=rows.length?rows.map(function(r,i){
    var values={order:String(i+1),name:esc(r.name),status:'<span class="status '+(r.enabled?'on':'off')+'">'+(r.enabled?'启用':'停用')+'</span>',handlers:esc((r.handlers||[]).join('、'))};
    return '<tr data-id="'+r.id+'" class="'+(r.id===selectedId?'selected':'')+'">'+cols.map(function(c){return '<td title="'+(c.key==='handlers'?esc((r.handlers||[]).join('、')):'')+'">'+values[c.key]+'</td>'}).join('')+'</tr>'
  }).join(''):'<tr><td class="empty" colspan="'+Math.max(1,cols.length)+'">暂无数据</td></tr>';
  $('#totalText').textContent='共 '+list.length.toLocaleString('zh-CN')+' 条';$('#prevBtn').disabled=page<=1;$('#nextBtn').disabled=page>=pages;
  var items=[];if(pages<=7){for(var n=1;n<=pages;n++)items.push(n)}else if(page<=4){items=[1,2,3,4,5,'…',pages]}else if(page>=pages-3){items=[1,'…',pages-4,pages-3,pages-2,pages-1,pages]}else{items=[1,'…',page-1,page,page+1,'…',pages]}
  $('#pageButtons').innerHTML=items.map(function(item){return item==='…'?'<span class="page-ellipsis">…</span>':'<button class="page-btn '+(item===page?'active':'')+'" data-page="'+item+'">'+item+'</button>'}).join('');$('#pageSize').value=String(pageSize);$('#jumpInput').max=String(pages)
}
function renderTags(){
  $('#handlerTags').innerHTML=draftHandlers.map(function(p){return '<span class="person-tag">'+esc(p)+'<button type="button" data-remove="'+esc(p)+'" aria-label="移除'+esc(p)+'">×</button></span>'}).join('');
  $('#handlerSearch').placeholder=draftHandlers.length?'':'请选择';
}
function renderPeople(){
  var q=$('#handlerSearch').value.trim().toLowerCase(),list=PEOPLE.filter(function(p){return !q||p.toLowerCase().indexOf(q)>-1});
  $('#personMenu').innerHTML=list.map(function(p){return '<button class="person-option '+(draftHandlers.indexOf(p)>-1?'chosen':'')+'" data-person="'+esc(p)+'" type="button">'+esc(p)+'</button>'}).join('')||'<div style="padding:8px;color:#909399">暂无匹配人员</div>'
}
function showDetail(){$('#detailEmpty').classList.add('hidden');$('#detailContent').classList.remove('hidden')}
function hideDetail(){selectedId=null;$('#detailContent').classList.add('hidden');$('#detailEmpty').classList.remove('hidden');renderTable()}
function loadForm(id){
  var r=records.find(function(x){return x.id===id});if(!r)return;selectedId=id;$('#categoryName').value=r.name;$('#categoryDesc').value=r.desc||'';$('#enabledSwitch').checked=!!r.enabled;$('#handlerMode').value=r.mode||'正选';draftHandlers=(r.handlers||[]).slice();renderTags();clearNameError();showDetail();renderTable()
}
function clearNameError(){$('#categoryName').classList.remove('invalid');$('#nameError').classList.remove('show')}
function showNameError(){$('#categoryName').classList.add('invalid');$('#nameError').classList.add('show');$('#categoryName').focus()}
function saveRecord(){
  if(!selectedId)return;var name=$('#categoryName').value.trim();if(!name){showNameError();return}clearNameError();
  var r=records.find(function(x){return x.id===selectedId});
  if(!r)return;
  r.name=name;r.desc=$('#categoryDesc').value.trim();r.enabled=$('#enabledSwitch').checked;r.mode=$('#handlerMode').value;r.handlers=draftHandlers.slice();saveJSON(RECORD_KEY,records);query='';$('#searchInput').value='';page=1;renderTable();$('#deleteBtn').disabled=false;toast('保存成功')
}
function renderNewTags(){$('#newHandlerTags').innerHTML=newDraftHandlers.map(function(p){return '<span class="person-tag">'+esc(p)+'<button type="button" data-new-remove="'+esc(p)+'" aria-label="移除'+esc(p)+'">×</button></span>'}).join('');$('#newHandlerSearch').placeholder=newDraftHandlers.length?'':'请选择'}
function renderNewPeople(){var q=$('#newHandlerSearch').value.trim().toLowerCase(),list=PEOPLE.filter(function(p){return !q||p.toLowerCase().indexOf(q)>-1});$('#newPersonMenu').innerHTML=list.map(function(p){return '<button class="person-option '+(newDraftHandlers.indexOf(p)>-1?'chosen':'')+'" data-new-person="'+esc(p)+'" type="button">'+esc(p)+'</button>'}).join('')||'<div style="padding:8px;color:#909399">暂无匹配人员</div>'}
function clearNewError(){$('#newName').classList.remove('invalid');$('#newNameError').classList.remove('show')}
function closeCreate(){$('#createMask').classList.remove('show');$('#newPersonMenu').classList.add('hidden')}
function openCreate(){$('#newName').value='';$('#newDesc').value='';$('#newEnabled').checked=true;$('#newHandlerMode').value='正选';$('#newHandlerSearch').value='';newDraftHandlers=[];renderNewTags();clearNewError();$('#createMask').classList.add('show');setTimeout(function(){$('#newName').focus()},0)}
function createRecord(){var name=$('#newName').value.trim();if(!name){$('#newName').classList.add('invalid');$('#newNameError').classList.add('show');$('#newName').focus();return}var max=records.reduce(function(m,x){return Math.max(m,parseInt(String(x.id).replace(/\D/g,''),10)||0)},0);records.push({id:'FC'+String(max+1).padStart(3,'0'),name:name,desc:$('#newDesc').value.trim(),enabled:$('#newEnabled').checked,mode:$('#newHandlerMode').value,handlers:newDraftHandlers.slice(),createdAt:nowText()});saveJSON(RECORD_KEY,records);query='';$('#searchInput').value='';closeCreate();hideDetail();renderTable();toast('新增成功')}
$('#searchBtn').addEventListener('click',function(){query=$('#searchInput').value.trim();page=1;renderTable()});
$('#searchInput').addEventListener('keydown',function(e){if(e.key==='Enter')$('#searchBtn').click()});
$('#addBtn').addEventListener('click',openCreate);$('#saveBtn').addEventListener('click',saveRecord);$('#categoryName').addEventListener('input',clearNameError);
$('#tableBody').addEventListener('click',function(e){var row=e.target.closest('tr[data-id]');if(row)loadForm(row.dataset.id)});
$('#prevBtn').addEventListener('click',function(){if(page>1){page--;renderTable()}});$('#nextBtn').addEventListener('click',function(){var pages=Math.max(1,Math.ceil(filtered().length/pageSize));if(page<pages){page++;renderTable()}});
$('#pageButtons').addEventListener('click',function(e){if(e.target.dataset.page){page=+e.target.dataset.page;renderTable()}});
$('#pageSize').addEventListener('change',function(){pageSize=+this.value;page=1;localStorage.setItem(SIZE_KEY,String(pageSize));renderTable()});
function jumpPage(){var pages=Math.max(1,Math.ceil(filtered().length/pageSize)),value=parseInt($('#jumpInput').value,10);if(!Number.isFinite(value))return;page=Math.max(1,Math.min(pages,value));$('#jumpInput').value='';renderTable()}
$('#jumpInput').addEventListener('keydown',function(e){if(e.key==='Enter')jumpPage()});$('#jumpInput').addEventListener('change',jumpPage);
$('#settingsBtn').addEventListener('click',function(e){e.stopPropagation();$('#settingsMenu').classList.toggle('hidden')});
$('#settingsMenu').addEventListener('click',function(e){e.stopPropagation()});
$('#closeColumnSettings').addEventListener('click',function(){$('#settingsMenu').classList.add('hidden')});
$('#columnOptions').addEventListener('change',function(e){var key=e.target.dataset.column;if(!key)return;e.target.checked?visible.push(key):visible=visible.filter(function(k){return k!==key});visible=COLUMNS.map(function(c){return c.key}).filter(function(k){return visible.indexOf(k)>-1});saveJSON(COLUMN_KEY,visible);renderTable()});
$('#resetColumns').addEventListener('click',function(){visible=COLUMNS.map(function(c){return c.key});saveJSON(COLUMN_KEY,visible);renderTable()});
var resizeState=null;
$('#tableHead').addEventListener('pointerdown',function(e){var handle=e.target.closest('[data-resize]');if(!handle)return;e.preventDefault();e.stopPropagation();var key=handle.dataset.resize,col=COLUMNS.find(function(c){return c.key===key});if(!col)return;resizeState={key:key,startX:e.clientX,startWidth:columnWidths[key],min:col.min,max:col.max,handle:handle};handle.classList.add('dragging');document.body.classList.add('column-resizing');if(handle.setPointerCapture)handle.setPointerCapture(e.pointerId)});
document.addEventListener('pointermove',function(e){if(!resizeState)return;var width=Math.max(resizeState.min,Math.min(resizeState.max,resizeState.startWidth+e.clientX-resizeState.startX));columnWidths[resizeState.key]=Math.round(width);var col=$('col[data-col="'+resizeState.key+'"]');if(col)col.style.width=columnWidths[resizeState.key]+'px'});
document.addEventListener('pointerup',function(){if(!resizeState)return;resizeState.handle.classList.remove('dragging');document.body.classList.remove('column-resizing');saveJSON(WIDTH_KEY,columnWidths);resizeState=null});
var panelResizeState=null;
function setListWidth(width,persist){var max=Math.max(560,workspace.getBoundingClientRect().width-508),value=Math.max(560,Math.min(max,Math.round(width)));workspace.style.setProperty('--list-width',value+'px');if(persist)saveJSON(LIST_WIDTH_KEY,value);return value}
$('#panelResizer').addEventListener('pointerdown',function(e){e.preventDefault();panelResizeState={startX:e.clientX,startWidth:workspace.querySelector('.panel').getBoundingClientRect().width};this.classList.add('dragging');document.body.classList.add('panel-resizing');if(this.setPointerCapture)this.setPointerCapture(e.pointerId)});
document.addEventListener('pointermove',function(e){if(panelResizeState)setListWidth(panelResizeState.startWidth+e.clientX-panelResizeState.startX,false)});
document.addEventListener('pointerup',function(){if(!panelResizeState)return;$('#panelResizer').classList.remove('dragging');document.body.classList.remove('panel-resizing');var width=workspace.querySelector('.panel').getBoundingClientRect().width;setListWidth(width,true);panelResizeState=null});
$('#panelResizer').addEventListener('keydown',function(e){if(e.key!=='ArrowLeft'&&e.key!=='ArrowRight')return;e.preventDefault();var width=workspace.querySelector('.panel').getBoundingClientRect().width+(e.key==='ArrowRight'?10:-10);setListWidth(width,true)});
document.addEventListener('click',function(){$('#settingsMenu').classList.add('hidden');$('#personMenu').classList.add('hidden');$('#newPersonMenu').classList.add('hidden')});

$('#handlerSearch').addEventListener('input',function(){renderPeople();$('#personMenu').classList.remove('hidden')});
$('#personMenu').addEventListener('click',function(e){var p=e.target.dataset.person;if(!p)return;var i=draftHandlers.indexOf(p);i>-1?draftHandlers.splice(i,1):draftHandlers.push(p);renderTags();renderPeople();$('#handlerSearch').value=''});
$('#handlerTags').addEventListener('click',function(e){var p=e.target.dataset.remove;if(!p)return;e.stopPropagation();draftHandlers=draftHandlers.filter(function(x){return x!==p});renderTags()});
$('#newHandlerPicker').addEventListener('click',function(e){e.stopPropagation();if(!e.target.dataset.newRemove){renderNewPeople();$('#newPersonMenu').classList.remove('hidden')}});

$('#newHandlerTags').addEventListener('click',function(e){var p=e.target.dataset.newRemove;if(!p)return;e.stopPropagation();newDraftHandlers=newDraftHandlers.filter(function(x){return x!==p});renderNewTags()});
$('#newName').addEventListener('input',clearNewError);$('#closeCreate').addEventListener('click',closeCreate);$('#cancelCreate').addEventListener('click',closeCreate);$('#confirmCreate').addEventListener('click',createRecord);$('#createMask').addEventListener('click',function(e){if(e.target===this)closeCreate()});
$('#deleteBtn').addEventListener('click',function(){if(selectedId)$('#deleteMask').classList.add('show')});$('#cancelDelete').addEventListener('click',function(){$('#deleteMask').classList.remove('show')});
$('#deleteMask').addEventListener('click',function(e){if(e.target===this)this.classList.remove('show')});
$('#confirmDelete').addEventListener('click',function(){if(!selectedId)return;records=records.filter(function(r){return r.id!==selectedId});saveJSON(RECORD_KEY,records);$('#deleteMask').classList.remove('show');hideDetail();toast('删除成功')});
renderTable();hideDetail();
})();
