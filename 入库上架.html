  info:    '<svg width="16" height="16" viewBox="0 0 16 16"><circle cx="8" cy="8" r="8" fill="#3D68FF"/><rect x="7.2" y="6.8" width="1.6" height="5" rx=".8" fill="#fff"/><circle cx="8" cy="4.6" r="1" fill="#fff"/></svg>',
  success: '<svg width="16" height="16" viewBox="0 0 16 16"><circle cx="8" cy="8" r="8" fill="#52C41A"/><path d="M4.6 8.4 7 10.6l4.4-5" stroke="#fff" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  warning: '<svg width="16" height="16" viewBox="0 0 16 16"><circle cx="8" cy="8" r="8" fill="#FA8C16"/><rect x="7.2" y="3.8" width="1.6" height="5.4" rx=".8" fill="#fff"/><circle cx="8" cy="11.4" r="1" fill="#fff"/></svg>',
  error:   '<svg width="16" height="16" viewBox="0 0 16 16"><circle cx="8" cy="8" r="8" fill="#FF4D4F"/><path d="M5.4 5.4 10.6 10.6M10.6 5.4 5.4 10.6" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/></svg>'
};
function toast(type, msg){
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.innerHTML = '<span class="t-ico">'+TOAST_ICON[type]+'</span><span>'+esc(msg)+'</span>';
  $('#toastWrap').appendChild(el);
  setTimeout(()=>{ el.classList.add('out'); setTimeout(()=>el.remove(), 260); }, 3000);
}

/* ---------- 页面状态 ---------- */
const st = {
  taskCode: null,   // 当前上架任务码
  rows: []          // 待上架商品行
};

/* ---------- 仓位排序：空仓位置顶；货架按字母A-Z、数字0-9（字母在前）；同货架按列升序、行降序 ---------- */
function parseLoc(loc){
  if(!loc || loc==='-') return null;
  const p = String(loc).split('-');
  return { shelf:p[0]||'', col:parseInt(p[1],10)||0, row:parseInt(p[2],10)||0 };
}
function shelfCmp(a, b){
  const aL = /^[A-Za-z]/.test(a), bL = /^[A-Za-z]/.test(b);
  if(aL !== bL) return aL ? -1 : 1;                    // 字母货架在前，数字货架在后
  if(aL) return a.localeCompare(b);                    // 字母 A-Z
  return (parseInt(a,10)||0) - (parseInt(b,10)||0);    // 数字 0-9
}
function locCmp(x, y){
  const px = parseLoc(x.loc), py = parseLoc(y.loc);
  if(!px && !py) return 0;
  if(!px) return -1;                                   // 空仓位置顶
  if(!py) return 1;
  const s = shelfCmp(px.shelf, py.shelf);
  if(s !== 0) return s;
  if(px.col !== py.col) return px.col - py.col;        // 列编号从小到大
  return py.row - px.row;                              // 行编号从大到小
}
function sortRows(){ st.rows.sort(locCmp); }

/* ---------- 获取上架任务 ---------- */
function loadTask(){
  const v = $('#taskInput').value.trim();
  if(!v){ toast('warning','请先输入/扫描上架任务码'); return; }
  // 任意任务码均可获取：库内无记录时按演示明细生成
  const items = TASKS_DB[v] || TASKS_DB['HF620'];
  st.taskCode = v;
  st.rows = items.map((it,i)=>({
    ...it, id:i+1,
    qty: it.pending,   // 本次上架量默认 = 待上架数量
    dmg: 0             // 上架破损量默认 0
  }));
  sortRows();
  // 获取任务成功后，任务码输入框置灰
  $('#taskInput').disabled = true;
  $('#taskCtl').classList.add('disabled');
  $('#btnAll').disabled = false;
  renderRows();
  toast('success','成功');
}
$('#taskInput').addEventListener('keydown', e=>{ if(e.key==='Enter') loadTask(); });

/* ---------- 渲染待上架列表 ---------- */
function renderRows(){
  const tb = $('#tbody');
  $('#emptyBox').style.display = st.rows.length ? 'none' : '';
  tb.innerHTML = st.rows.map((r,i)=>{
    const locTxt = r.loc && r.loc!=='-' ? r.loc : '-';
    return '<tr data-i="'+i+'">'
      + '<td class="c">'+(i+1)+'</td>'
      + '<td><div class="thumb">暂无图片</div></td>'
      + '<td><span class="sku-link">'+esc(r.sku)+'</span><div class="sub-line">'+esc(r.ext)+'</div></td>'
      + '<td>'+esc(r.wh)+'/'+esc(locTxt)+'<div class="sub-line"><span class="link-op" data-loc="'+i+'">仓位调整</span></div></td>'
      + '<td>'+r.purchase+'<div class="sub-line">'+r.inbound+'</div></td>'
      + '<td>'+r.pending+'/'+r.stock+'<div class="sub-line">'+r.qty+'/'+r.dmg+'</div></td>'
      + '<td>'+esc(r.putawayBy)+'/'+esc(r.signBy)+'<div class="sub-line">'+esc(r.signTime)+'</div></td>'
      + '<td><span class="link-op" data-done="'+i+'">完成上架</span></td>'
      + '</tr>';
  }).join('');
  // 行内事件
  tb.querySelectorAll('[data-loc]').forEach(a=>a.addEventListener('click', ()=> openLocModal(+a.dataset.loc)));
  tb.querySelectorAll('[data-done]').forEach(a=>a.addEventListener('click', ()=> doneRow(+a.dataset.done)));
}

/* ---------- 完成上架（行） ---------- */
let doneIdx = null;
function doneRow(i){
  const r = st.rows[i];
  // 无仓位：提示先选择仓位
  if(!r.loc || r.loc==='-'){
    toast('error', r.sku + ',暂无仓位,请先选择仓位');
    return;
  }
  // 有仓位：弹出完成上架弹窗
  doneIdx = i;
  $('#donePending').value = r.pending;
  $('#doneQty').value = r.qty;
  $('#doneDmg').value = r.dmg > 0 ? r.dmg : '';
  $('#doneMask').style.display = 'flex';
  setTimeout(()=> $('#doneQty').focus(), 50);
}
function closeDoneModal(){
  $('#doneMask').style.display = 'none';
  doneIdx = null;
}
$('#doneClose').addEventListener('click', closeDoneModal);
$('#doneCancel').addEventListener('click', closeDoneModal);
$('#doneOk').addEventListener('click', ()=>{
  const r = st.rows[doneIdx];
  let qty = parseInt($('#doneQty').value||'0',10);
  let dmg = parseInt($('#doneDmg').value||'0',10);
  if(isNaN(qty)||qty<0) qty=0;
  if(isNaN(dmg)||dmg<0) dmg=0;
  if(qty + dmg !== r.pending){
    toast('error','本次上架量+上架破损量不等于待上架数量，请检查后再上架。');
    return;
  }
  r.qty = qty; r.dmg = dmg;
  const idx = doneIdx;
  closeDoneModal();
  st.rows.splice(idx,1);        // 上架成功后移出列表（不提供人工删除）
  renderRows();
  toast('success','完成');
  if(!st.rows.length) clearTask(true);
});

/* ---------- 一键上架：完成列表内全部商品，上架成功后清空列表 ---------- */
$('#btnAll').addEventListener('click', ()=>{
  if(!st.rows.length){ toast('warning','暂无待上架商品'); return; }
  clearTask(true);
  toast('success','完成');
});
function clearTask(clearCode){
  st.rows = [];
  renderRows();
  if(clearCode){
    st.taskCode = null;
    $('#taskInput').value = '';
    $('#taskInput').disabled = false;
    $('#taskCtl').classList.remove('disabled');
    $('#btnAll').disabled = true;
  }
}

/* ---------- 刷新：按仓位规则重新排序 ---------- */
$('#btnRefresh').addEventListener('click', ()=>{
  if(!st.rows.length){ toast('info','暂无数据'); return; }
  sortRows();
  renderRows();
  toast('success','成功');
});

/* ---------- 快速调整仓位弹窗 ---------- */
let locIdx = null;
function openLocModal(i){
  locIdx = i;
  const r = st.rows[i];
  $('#locSku').value = r.sku;
  $('#locCur').value = (r.loc && r.loc!=='-') ? r.loc : '暂无仓位';
  $('#locIpt').value = '';
  $('#locClear').classList.remove('show');
  $('#syncCk').checked = false;
  $('#locList').classList.remove('open');
  $('#locList').innerHTML = '';
  $('#locMask').style.display = 'flex';
  setTimeout(()=> $('#locIpt').focus(), 50);
}
function closeLocModal(){
  $('#locMask').style.display = 'none';
  locIdx = null;
}
function renderLocList(kw){
  const r = st.rows[locIdx];
  const locs = (LOC_DB[r.wh] || []).filter(l=>!kw || l.toLowerCase().includes(kw.toLowerCase()));
  $('#locList').innerHTML = locs.length
    ? locs.map(l=>'<div class="loc-opt'+(l===$('#locIpt').value.trim()?' sel':'')+'" data-v="'+esc(l)+'">'+esc(l)+'</div>').join('')
    : '<div class="loc-empty">无匹配仓位</div>';
  $('#locList').querySelectorAll('.loc-opt').forEach(o=>o.addEventListener('click', ()=>{
    $('#locIpt').value = o.dataset.v;
    $('#locClear').classList.add('show');
    $('#locList').classList.remove('open');
    $('#locList').innerHTML = '';
    $('#locIpt').focus();
  }));
}
$('#locIpt').closest('.ctl').addEventListener('click', ()=>{
  if(locIdx===null) return;
  renderLocList($('#locIpt').value.trim());
  $('#locList').classList.add('open');
});
$('#locIpt').addEventListener('input', ()=>{
  $('#locClear').classList.toggle('show', !!$('#locIpt').value.trim());
  renderLocList($('#locIpt').value.trim());
  $('#locList').classList.add('open');
});
$('#locClear').addEventListener('click', e=>{
  e.stopPropagation();
  $('#locIpt').value = '';
  $('#locClear').classList.remove('show');
  renderLocList('');
  $('#locList').classList.add('open');
  $('#locIpt').focus();
});
$('#locIpt').addEventListener('keydown', e=>{ if(e.key==='Enter') $('#locOk').click(); });
$('#locClose').addEventListener('click', closeLocModal);
$('#locCancel').addEventListener('click', closeLocModal);
$('#locOk').addEventListener('click', ()=>{
  const v = $('#locIpt').value.trim();
  if(!v){ toast('warning','请选择调整仓位'); return; }
  const r = st.rows[locIdx];
  r.loc = v;
  // 同步修改任务下其他空仓位SKU
  if($('#syncCk').checked){
    st.rows.forEach((x,k)=>{ if(k!==locIdx && (!x.loc || x.loc==='-')) x.loc = v; });
  }
  closeLocModal();
  renderRows();               // 仓位修改后不重新排序，刷新后才重新排序
  toast('success','成功');
});
</script>
