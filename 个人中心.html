<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ERP - 个人中心</title>
<style>
*{box-sizing:border-box}body.account-page{min-width:800px;margin:0;padding-top:38px;background:#f5f5f5;color:#303133;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid #3d68ff;outline-offset:2px}.account-page .layout{display:block;min-height:calc(100vh - 38px)}.account-page .sider{display:none!important}.account-page .main{padding:8px!important}.account-page .top-menu .tm.active{background:transparent;color:rgba(255,255,255,.88)}.account-section,.account-actions{margin-bottom:16px;background:#fff}.section-title{height:57px;display:flex;align-items:center;padding:0 16px;border-bottom:1px solid #eee;font-size:16px;font-weight:600}.profile-details{min-height:136px;display:flex;align-items:center;gap:28px;padding:24px}.profile-logo{width:65px;height:65px;flex:none}.profile-lines{display:grid;gap:8px}.profile-subline{display:flex;gap:48px}.security-row{min-height:95px;display:flex;align-items:center;gap:18px;padding:16px;border-bottom:1px solid #f0f0f0}.security-row:last-child{border-bottom:0}.security-icon{width:25px;height:25px;flex:none;color:#333}.security-info{flex:1}.security-name{font-weight:600}.status-badge{display:inline-block;margin-left:8px;padding:1px 9px;border-radius:4px;background:#12c994;color:#fff;font-size:12px;font-weight:400}.security-description{margin-top:3px;color:#b1b7bf}.account-link{border:0;background:none;color:#3d68ff}.account-link:hover{text-decoration:underline}.account-actions{display:flex;justify-content:flex-end;padding:16px}.account-back{height:32px;min-width:64px;border:1px solid #3d68ff;border-radius:5px;background:#fff;color:#3d68ff}.account-back:hover{background:#f1f5ff}.modal-layer{position:fixed;inset:0;z-index:400;display:flex;align-items:center;justify-content:center;padding:20px;background:#0007}.modal-layer[hidden],.dialog[hidden]{display:none}.dialog{width:400px;max-width:calc(100vw - 40px);padding:20px 24px;border-radius:8px;background:#fff;box-shadow:0 12px 30px #0003}.dialog.wide{width:720px}.dialog-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;font-size:16px;font-weight:600}.dialog-close{width:24px;height:24px;border:0;background:none;color:#999;font-size:23px;line-height:1}.dialog-close:hover{color:#333}.dialog-body{min-height:100px}.dialog-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:24px}.btn{height:32px;padding:0 16px;border:1px solid #d9d9d9;border-radius:5px;background:#fff;color:#555}.btn.primary{border-color:#3d68ff;background:#3d68ff;color:#fff}.field{display:flex;align-items:center;gap:10px;margin:0 0 24px}.field label{width:78px;flex:none;text-align:right}.input-wrap{position:relative;flex:1}.input-wrap input{width:100%;height:33px;padding:0 36px 0 11px;border:1px solid #d8d8d8;border-radius:5px;outline:0}.input-wrap input:focus{border-color:#3d68ff}.input-wrap input::placeholder{color:#c5c8cc}.eye{position:absolute;top:2px;right:3px;width:29px;height:29px;border:0;background:none;color:#999;font-size:17px}.form-error{min-height:18px;color:#d83a37;font-size:12px}.dialog-note{margin:8px 0;color:#999}.passkey-toolbar{margin-bottom:8px}.passkey-table{width:100%;border-collapse:collapse;font-size:12px}.passkey-table th,.passkey-table td{padding:9px;border:1px solid #bfc2c7;text-align:left}.passkey-table th{background:#ededed}.passkey-table td:last-child,.passkey-table th:last-child{text-align:center}.passkey-table .link-danger{border:0;background:none;color:#f56c6c}.passkey-table .link-edit{border:0;background:none;color:#3d68ff}.verify-field{display:block;margin-bottom:22px}.verify-field span{display:block;margin-bottom:7px}.verify-field input{width:100%;height:33px;padding:0 12px;border:1px solid #d8d8d8;border-radius:4px}.verify-field input[readonly]{background:#f2f2f2}.toast{position:fixed;top:60px;left:50%;z-index:500;padding:9px 16px;border-radius:5px;background:#303133;color:#fff;transform:translateX(-50%)}.toast[hidden]{display:none}
</style>
</head>
<body class="account-page">
<div class="layout"><main class="main">
  <section class="account-section" aria-labelledby="accountTitle"><h1 class="section-title" id="accountTitle">账号信息</h1><div class="profile-details"><svg class="profile-logo" viewBox="0 0 72 72" aria-hidden="true"><path fill="#3d68ff" d="M36 6 6 60h60l-8-14H30l14-25z"/><path fill="#3d68ff" d="m46 27 8 14H38z"/></svg><div class="profile-lines"><div>姓名: XWD</div><div class="profile-subline"><span>手机号: 15659777442</span><span>邮箱: 139442959@qq.com</span></div></div></div></section>
  <section class="account-section" aria-labelledby="securityTitle"><h2 class="section-title" id="securityTitle">安全设置</h2><div class="security-row"><svg class="security-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="4" y="10" width="16" height="12" rx="1"/><path d="M8 10V6a4 4 0 0 1 8 0v4M12 15v3"/></svg><div class="security-info"><div class="security-name">登录密码 <span class="status-badge">已设置</span></div><div class="security-description">登录账号时需要输入的密码</div></div><button class="account-link" id="changePassword" type="button">修改</button></div><div class="security-row"><svg class="security-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="15" cy="9" r="6"/><path d="m10 14-8 8m5-5 2 2m1-5 2 2"/></svg><div class="security-info"><div class="security-name">通行密钥 <span class="status-badge">已设置</span></div><div class="security-description">通行密钥是一种基于 FIDO 标准的认证凭证，允许您使用设备支持的指纹识别、面容识别或安全密钥等认证方式进行登录</div></div><button class="account-link" id="managePasskeys" type="button">管理</button></div></section>
  <div class="account-actions"><button class="account-back" id="backButton" type="button">返 回</button></div>
</main></div>

<div class="modal-layer" id="modalLayer" hidden>
  <section class="dialog" id="passwordDialog" role="dialog" aria-modal="true" aria-labelledby="passwordTitle" hidden><header class="dialog-head"><span id="passwordTitle">修改密码</span><button class="dialog-close" type="button" data-close aria-label="关闭">×</button></header><form id="passwordForm"><div class="dialog-body"><div class="field"><label for="oldPassword">旧密码:</label><div class="input-wrap"><input id="oldPassword" type="password" autocomplete="current-password" placeholder="请输入旧密码" required><button class="eye" type="button" data-eye="oldPassword" aria-label="显示旧密码">◉</button></div></div><div class="field"><label for="newPassword">新密码:</label><div class="input-wrap"><input id="newPassword" type="password" autocomplete="new-password" placeholder="请输入新密码" required><button class="eye" type="button" data-eye="newPassword" aria-label="显示新密码">◉</button></div></div><div class="field"><label for="confirmPassword">确认密码:</label><div class="input-wrap"><input id="confirmPassword" type="password" autocomplete="new-password" placeholder="再次输入新密码" required><button class="eye" type="button" data-eye="confirmPassword" aria-label="显示确认密码">◉</button></div></div><div class="form-error" id="passwordError" role="alert"></div></div><footer class="dialog-foot"><button class="btn" type="button" data-close>取 消</button><button class="btn primary" type="submit">确 定</button></footer></form></section>
  <section class="dialog wide" id="passkeyDialog" role="dialog" aria-modal="true" aria-labelledby="passkeyTitle" hidden><header class="dialog-head"><span id="passkeyTitle">通行密钥管理</span><button class="dialog-close" type="button" data-close aria-label="关闭">×</button></header><div class="dialog-body"><div class="passkey-toolbar"><button class="btn primary" id="addPasskey" type="button">新 增</button></div><p class="dialog-note">可添加当前账号的通行密钥，用于通行密钥登录</p><table class="passkey-table"><thead><tr><th>通行密钥名称</th><th>上次使用时间</th><th>创建时间</th><th>操作</th></tr></thead><tbody id="passkeyRows"></tbody></table></div></section>
  <section class="dialog" id="verifyDialog" role="dialog" aria-modal="true" aria-labelledby="verifyTitle" hidden><header class="dialog-head"><span id="verifyTitle">验证身份</span><button class="dialog-close" type="button" data-close aria-label="关闭">×</button></header><form id="verifyForm"><div class="dialog-body"><label class="verify-field"><span>手机号</span><input value="15659777442" readonly></label><label class="verify-field"><span>登录密码</span><span class="input-wrap"><input id="verifyPassword" type="password" autocomplete="current-password" placeholder="请输入密码" required><button class="eye" type="button" data-eye="verifyPassword" aria-label="显示登录密码">◉</button></span></label><div class="form-error" id="verifyError" role="alert"></div></div><footer class="dialog-foot"><button class="btn" type="button" data-close>取 消</button><button class="btn primary" type="submit">确 定</button></footer></form></section>
</div>
<div class="toast" id="accountToast" role="status" hidden></div>
<script src="菜单.js"></script>
<script>
(function(){
  'use strict';
  var $=function(id){return document.getElementById(id)};
  var dialogs=['passwordDialog','passkeyDialog','verifyDialog'];
  var toastTimer;
  var passkeys=[{name:'密钥-2026-08-04 15:23',used:'2026-08-04 15:23:38',created:'2026-08-04 15:23:27'}];
  function showToast(text){var node=$('accountToast');node.textContent=text;node.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(function(){node.hidden=true},2600)}
  function showDialog(id){$('modalLayer').hidden=false;dialogs.forEach(function(name){$(name).hidden=name!==id});var first=$(id).querySelector('input:not([readonly]),button');if(first)first.focus()}
  function closeDialogs(){$('modalLayer').hidden=true;dialogs.forEach(function(id){$(id).hidden=true});$('passwordForm').reset();$('verifyForm').reset();$('passwordError').textContent='';$('verifyError').textContent=''}
  function renderPasskeys(){var rows=$('passkeyRows');rows.replaceChildren();passkeys.forEach(function(entry,index){var row=document.createElement('tr'),name=document.createElement('td'),used=document.createElement('td'),created=document.createElement('td'),actions=document.createElement('td');name.textContent=entry.name+' ';var edit=document.createElement('button');edit.type='button';edit.className='link-edit';edit.textContent='✎';edit.setAttribute('aria-label','编辑通行密钥名称');edit.addEventListener('click',function(){var next=prompt('通行密钥名称',entry.name);if(next&&next.trim()){entry.name=next.trim();renderPasskeys()}});name.appendChild(edit);used.textContent=entry.used;created.textContent=entry.created;var remove=document.createElement('button');remove.type='button';remove.className='link-danger';remove.textContent='删除';remove.addEventListener('click',function(){if(confirm('确定删除该通行密钥吗？')){passkeys.splice(index,1);renderPasskeys()}});actions.appendChild(remove);[name,used,created,actions].forEach(function(cell){row.appendChild(cell)});rows.appendChild(row)});if(!passkeys.length){var empty=document.createElement('tr'),cell=document.createElement('td');cell.colSpan=4;cell.textContent='暂无通行密钥';cell.style.textAlign='center';empty.appendChild(cell);rows.appendChild(empty)}}
  function freshUrl(file){var url=new URL(file,location.href);url.searchParams.set('_t',String(Date.now()));return url.href}
  $('backButton').addEventListener('click',function(){var target;try{target=sessionStorage.getItem('erp-account-return')}catch(_){}if(target){var url=new URL(target,location.href);if(url.origin===location.origin&&url.pathname!==location.pathname&&/\.html$/i.test(url.pathname)){url.searchParams.delete('_erp_embed');url.searchParams.set('_t',String(Date.now()));location.href=url.href;return}}if(history.length>1){history.back();return}location.href=freshUrl('首页.html')});
  $('changePassword').addEventListener('click',function(){showDialog('passwordDialog')});
  $('managePasskeys').addEventListener('click',function(){renderPasskeys();showDialog('passkeyDialog')});
  $('addPasskey').addEventListener('click',function(){showDialog('verifyDialog')});
  document.querySelectorAll('[data-close]').forEach(function(button){button.addEventListener('click',closeDialogs)});
  $('modalLayer').addEventListener('click',function(event){if(event.target===this)closeDialogs()});
  document.addEventListener('keydown',function(event){if(event.key==='Escape'&&!$('modalLayer').hidden)closeDialogs()});
  document.querySelectorAll('[data-eye]').forEach(function(button){button.addEventListener('click',function(){var input=$(button.dataset.eye),show=input.type==='password';input.type=show?'text':'password';button.setAttribute('aria-label',(show?'隐藏':'显示')+'密码')})});
  $('passwordForm').addEventListener('submit',function(event){event.preventDefault();var old=$('oldPassword').value,next=$('newPassword').value,repeat=$('confirmPassword').value;if(!old||!next||!repeat){$('passwordError').textContent='请填写完整密码信息';return}if(next!==repeat){$('passwordError').textContent='两次输入的新密码不一致';return}if(next.length<8){$('passwordError').textContent='新密码至少 8 位';return}closeDialogs();showToast('密码修改需接入认证服务')});
  $('verifyForm').addEventListener('submit',function(event){event.preventDefault();if(!$('verifyPassword').value){$('verifyError').textContent='请输入登录密码';return}closeDialogs();showToast('通行密钥绑定需接入认证服务')});
})();
</script>
</body>
</html>
